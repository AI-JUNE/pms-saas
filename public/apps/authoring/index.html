<script>
/* ==== 외부 LLM 전송 통제 — 3003·3004 와 같은 유틸(마스킹·감사 로그·동의) ==== */
function maskSensitive(text,opts){opts=opts||{};if(text==null)return{masked:'',map:{},counts:{}};var s=String(text),map={},counts={},oneWay=!!opts.oneWay,seen=Object.create(null);
function token(kind,original){if(seen[original])return seen[original];counts[kind]=(counts[kind]||0)+1;var t='['+kind+'_'+counts[kind]+']';seen[original]=t;if(!oneWay)map[t]=original;return t;}
function sub(kind,re){s=s.replace(re,function(m){return token(kind,m);});}
function escapeRe(x){return String(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function subList(kind,list){if(!list||!list.length)return;var arr=list.filter(Boolean).map(String).sort(function(a,b){return b.length-a.length;});arr.forEach(function(name){if(name.trim().length<2)return;s=s.replace(new RegExp(escapeRe(name),'g'),function(m){return token(kind,m);});});}
subList('고객사',opts.orgNames);subList('인명',opts.personNames);
sub('이메일',/[\w.+-]+@[\w-]+\.[\w.-]+/g);sub('주민번호',/\b\d{6}-?[1-8]\d{6}\b/g);sub('사업자번호',/\b\d{3}-\d{2}-\d{5}\b/g);sub('전화',/\b(01[016789]|0\d{1,2})[-.\s]?\d{3,4}[-.\s]?\d{4}\b/g);sub('계좌',/\b\d{2,6}-\d{2,6}-\d{3,7}\b/g);
return{masked:s,map:map,counts:counts};}
var LLM_AUDIT_KEY='llmAuditLog',LLM_AUDIT_MAX=500;
function logExternalSend(entry){var rec={ts:new Date().toISOString(),app:entry.app||'',provider:entry.provider||'',endpointHost:entry.endpointHost||'',dataKinds:entry.dataKinds||[],fieldCount:entry.fieldCount||0,charCount:entry.charCount||0,maskApplied:!!entry.maskApplied,fileBase64Included:!!entry.fileBase64Included};
try{var arr=JSON.parse(localStorage.getItem(LLM_AUDIT_KEY)||'[]');arr.push(rec);if(arr.length>LLM_AUDIT_MAX)arr=arr.slice(arr.length-LLM_AUDIT_MAX);localStorage.setItem(LLM_AUDIT_KEY,JSON.stringify(arr));}catch(e){}return rec;}
function hostOf(prov){return({claude:'api.anthropic.com',gpt:'api.openai.com',gemini:'generativelanguage.googleapis.com'})[prov]||String(prov||'');}
function confirmExternalSend(info){info=info||{};var skipKey='llmConsentSkip:'+(info.provider||'');if(sessionStorage.getItem(skipKey)==='1')return Promise.resolve(true);
return new Promise(function(resolve){var ov=document.createElement('div');ov.className='llm-consent-overlay';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');

/* ---------- 파일 읽기 (3003 extractFile 과 같은 규칙) ---------- */
async function extractFile(file){
  const name=file.name.toLowerCase();
  if(/\.(txt|md|csv|tsv|json)$/.test(name))return await file.text();
  if(name.endsWith('.pdf')){
    if(!window.pdfjsLib)throw new Error('PDF 라이브러리를 불러오지 못했습니다.');
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let t='';
    for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+='[p.'+i+'] '+c.items.map(x=>x.str).join(' ')+'\n';}
    if(t.replace(/\s|\[p\.\d+\]/g,'').length<40)throw new Error('PDF 에서 글자를 찾지 못했습니다(스캔 이미지로 보임). 텍스트형 PDF 나 DOCX 로 올려 주세요.');
    return t;
  }
  if(name.endsWith('.docx')){if(!window.mammoth)throw new Error('DOCX 라이브러리를 불러오지 못했습니다.');return (await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value;}
  if(name.endsWith('.hwpx')||name.endsWith('.pptx')){
    const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const re=name.endsWith('.hwpx')?/Contents\/section\d+\.xml$/i:/ppt\/slides\/slide\d+\.xml$/i;
    const paths=Object.keys(zip.files).filter(p=>re.test(p)).sort((a,b)=>(+a.match(/(\d+)\.xml$/)[1])-(+b.match(/(\d+)\.xml$/)[1]));
    let out='';for(const p of paths){const xml=await zip.files[p].async('string');out+=(name.endsWith('.pptx')?'[슬라이드 '+p.match(/(\d+)\.xml$/)[1]+'] ':'')+xml.replace(/<\/(hp:p|a:p)>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')+'\n';}
    out=out.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
    if(out.length<20)throw new Error('본문을 추출하지 못했습니다. PDF 로 저장해 올려 주세요.');return out;
  }
  if(name.endsWith('.hwp'))throw new Error('구형 HWP 는 브라우저에서 읽을 수 없습니다. 한글에서 HWPX 또는 PDF 로 저장해 올려 주세요.');
  throw new Error('지원하지 않는 형식입니다(PDF·DOCX·HWPX·PPTX·TXT).');
}

    catch(e){toast(f.name+': '+e.message);}

function materialsText(){

function rateFor(model){return S.prov.rates[model]||EPA.RATES[model]||null;}
function costText(inTok,outTok){const r=rateFor(S.prov.model);if(!r)return '단가 미설정(AI 연동에서 입력)';const c=(inTok/1e6)*r.in+(outTok/1e6)*r.out;return '약 $'+c.toFixed(2)+' (입력 '+fmt(inTok)+' · 출력 최대 '+fmt(outTok)+' 토큰 기준)';}
function cancelRun(){if(S.abort)S.abort.abort();busy(false);}
async function readClaudeStream(res,onProgress){
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='',text='',stop='',usage={in:0,out:0};
  for(;;){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,i);buf=buf.slice(i+2);
      const line=chunk.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;let ev;try{ev=JSON.parse(line.slice(5).trim());}catch(e){continue;}
      if(ev.type==='message_start'&&ev.message&&ev.message.usage)usage.in=(ev.message.usage.input_tokens||0)+(ev.message.usage.cache_read_input_tokens||0);
      else if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){text+=ev.delta.text;onProgress&&onProgress(text.length);}
      else if(ev.type==='message_delta'){if(ev.delta&&ev.delta.stop_reason)stop=ev.delta.stop_reason;if(ev.usage)usage.out=ev.usage.output_tokens||usage.out;}
      else if(ev.type==='error')throw new Error('Claude 오류: '+((ev.error&&ev.error.message)||'알 수 없음'));
    }}
  return {text,stop,usage};
}
async function callLLM(system,user,maxTok,onProgress,kind){
  const p=S.prov.provider,key=S.prov.key,model=S.prov.model;
  if(!key)throw new Error('AI 연동에서 API 키를 먼저 넣어 주세요.');
  const inTok=EPA.estimateTokens(system.length+user.length);
  if(!(await confirmExternalSend({provider:PROVIDERS[p].name,endpointHost:hostOf(p),dataKinds:['제안 자료(RFP·제안서 발췌)','발표 설정'],charCount:system.length+user.length,maskApplied:true,costText:costText(inTok,maxTok)})))throw new Error('__CANCEL__');
  logExternalSend({app:'EPA',provider:p,endpointHost:hostOf(p),dataKinds:[kind||'발표본 생성'],charCount:user.length,fieldCount:1,maskApplied:true});
  S.abort=new AbortController();const sig=S.abort.signal;
  if(p==='claude'){
    const body={model,max_tokens:maxTok,stream:true,system,messages:[{role:'user',content:user}],output_config:{effort:'medium'},fallbacks:'default'};
    const headers={'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','anthropic-beta':'server-side-fallback-2026-07-01'};
    let res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:sig,headers,body:JSON.stringify(body)});
    if(res.status===400){const t=await res.text();if(/fallback/i.test(t)){delete body.fallbacks;delete headers['anthropic-beta'];res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:sig,headers,body:JSON.stringify(body)});}else throw new Error('Claude 오류 400: '+t.slice(0,240));}
    if(!res.ok)throw new Error('Claude 오류 '+res.status+': '+(await res.text()).slice(0,240));
    const r=await readClaudeStream(res,onProgress);
    if(r.stop==='refusal')throw new Error('AI 가 이 요청을 거절했습니다. 자료 내용을 확인하거나 다른 모델로 시도해 주세요.');
    return {text:r.text,truncated:r.stop==='max_tokens',usage:r.usage};
  }
  if(p==='gpt'){
    const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',signal:sig,headers:{'content-type':'application/json','authorization':'Bearer '+key},body:JSON.stringify({model,messages:[{role:'system',content:system},{role:'user',content:user}],response_format:{type:'json_object'},max_completion_tokens:maxTok})});
    if(!res.ok)throw new Error('GPT 오류 '+res.status+': '+(await res.text()).slice(0,240));
    const d=await res.json();return {text:d.choices?.[0]?.message?.content||'',truncated:d.choices?.[0]?.finish_reason==='length',usage:{in:d.usage?.prompt_tokens||0,out:d.usage?.completion_tokens||0}};
  }
  if(p==='gemini'){
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{method:'POST',signal:sig,headers:{'content-type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:maxTok,responseMimeType:'application/json'}})});
    if(!res.ok)throw new Error('Gemini 오류 '+res.status+': '+(await res.text()).slice(0,240));
    const d=await res.json();const u=d.usageMetadata||{};return {text:(d.candidates?.[0]?.content?.parts||[]).map(x=>x.text).join(''),truncated:d.candidates?.[0]?.finishReason==='MAX_TOKENS',usage:{in:u.promptTokenCount||0,out:u.candidatesTokenCount||0}};
  }
  throw new Error('알 수 없는 공급자');
}
function unmask(obj,map){if(!map||!Object.keys(map).length)return obj;let s=JSON.stringify(obj);Object.keys(map).forEach(t=>{s=s.split(t).join(map[t].replace(/\\/g,'\\\\').replace(/"/g,'\\"'));});return JSON.parse(s);}
async function runGenerate(){
  const mat=materialsText();
  if(!mat.trim()&&!S.analysis&&!S.strategy){toast('자료를 올리거나 붙여 넣어 주세요.');return;}
  const pr=EPA.buildDeckPrompt({project:S.project,minutes:S.minutes,maxSlides:S.maxSlides,audience:S.audience,emphasis:S.emphasis,materials:mat,analysis:S.analysis,strategy:S.strategy});
  /* 보내는 본문 전체(사업 정보·3002/3004 요약·자료)를 한 번에 가린다 — 발주처 이름은 선택, 개인정보는 항상 */
  const m=maskSensitive(pr.user,{oneWay:!S.maskOrg,orgNames:S.maskOrg?[S.project.client].filter(Boolean):[]});
  pr.user=m.masked;
  busy(true,'발표본을 만드는 중','목표 '+pr.slides+'장 · AI 응답을 기다리고 있습니다(1~3분).');
  try{
    const r=await callLLM(pr.system,pr.user,32000,n=>{$('#busyM').textContent='받은 글자 '+fmt(n)+'자 · 계속 받는 중';});
    S.lastUsage=r.usage;
    let raw=EPA.parseJSON(r.text);
    if(!raw){throw new Error(r.truncated?'응답이 출력 상한에서 잘려 JSON 을 해석하지 못했습니다. 발표 시간을 줄이거나 다시 시도해 주세요.':'AI 응답을 JSON 으로 해석하지 못했습니다. 다시 시도해 주세요.');}
    if(S.maskOrg)raw=unmask(raw,m.map);
    const n=EPA.normalizeDeck(raw,{minutes:S.minutes,client:S.project.client,company:S.project.company,title:S.project.name});
    if(!n.deck)throw new Error(n.warnings.join(' / '));
    const pages=EPA.paginateDeck(n.deck);
    S.deck=n.deck;S.warnings=n.warnings.concat(pages);if(r.truncated)S.warnings.unshift('응답이 출력 상한에서 잘렸습니다 — 뒷부분 슬라이드가 빠졌을 수 있습니다.');
    S.sel=0;EPA.saveResult(localStorage,S.deck);busy(false);
    toast('발표본 '+S.deck.slides.length+'장을 만들었습니다'+(r.usage?(' · 입력 '+fmt(r.usage.in)+' / 출력 '+fmt(r.usage.out)+' 토큰'):''));go('edit');
  }catch(e){busy(false);if(e.message!=='__CANCEL__'&&e.name!=='AbortError')toast(e.message);}
}

async function runRegen(mode){
  if(!S.deck)return;const idx=S.sel,hint=($('#regenHint')||{}).value||'';S.regenHint=hint;
  const pr=EPA.buildSlidePrompt(S.deck,idx,{mode,targetSec:slideTarget(),instruction:hint,materials:materialsText()});
  const m=maskSensitive(pr.user,{oneWay:!S.maskOrg,orgNames:S.maskOrg?[S.project.client||S.deck.meta.client].filter(Boolean):[]});
  pr.user=m.masked;
  busy(true,mode==='notes'?'노트 길이를 맞추는 중':(idx+1)+'번 슬라이드를 다시 만드는 중','AI 응답을 기다리고 있습니다.');
  try{
    const r=await callLLM(pr.system,pr.user,mode==='notes'?4000:8000,n=>{$('#busyM').textContent='받은 글자 '+fmt(n)+'자';},mode==='notes'?'노트 길이 맞추기':'슬라이드 다시 만들기');
    S.lastUsage=r.usage;
    let raw=EPA.parseJSON(r.text);
    if(!raw&&mode==='slide')throw new Error('AI 응답을 JSON 으로 해석하지 못했습니다. 다시 시도해 주세요.');
    if(raw&&S.maskOrg)raw=unmask(raw,m.map);
    const n=mode==='notes'?EPA.mergeNotes(S.deck,idx,raw||r.text,pr.targetSec):EPA.mergeSlide(S.deck,idx,raw,{targetSec:pr.targetSec});
    if(!n.deck)throw new Error(n.warnings.join(' / '));
    keepUndo(mode==='notes'?'노트 맞추기':'다시 만들기');
    S.deck.slides[idx]=n.deck.slides[idx];S.warnings=n.warnings.concat(S.warnings).slice(0,20);busy(false);
    toast((idx+1)+'번 '+(mode==='notes'?'노트를 맞췄습니다':'슬라이드를 다시 만들었습니다')+' · 약 '+n.fit.seconds+'초'+(r.usage?(' · 입력 '+fmt(r.usage.in)+' / 출력 '+fmt(r.usage.out)+' 토큰'):''));render();
  }catch(e){busy(false);if(e.message!=='__CANCEL__'&&e.name!=='AbortError')toast(e.message);}
}

function regenBox(s){
  const tg=slideTarget(),f=EPA.notesFit(s.notes,tg);
  const st=!tg?'표지 — 목표 시간 없음':'목표 약 '+tg+'초(±10% = '+f.minChars+'~'+f.maxChars+'자) · 지금 약 '+f.seconds+'초 '+({ok:'✓ 맞음',short:'· 짧음',long:'· 김'})[f.verdict];
  return '<div class="note '+(f.ok||!tg?'ok':'')+'" style="margin-bottom:14px"><div id="fitMsg">'+esc(st)+'</div>'
  +'<label class="f" style="margin-top:10px">고칠 점(선택 — 다시 만들 때 AI 에 함께 보냄)<input type="text" id="regenHint" maxlength="600" value="'+esc(S.regenHint||'')+'" placeholder="예: 수치보다 사례 중심으로, 표로 바꿔 줘"></label>'
  +'<div class="row" style="margin-top:10px"><button class="btn sm" onclick="runRegen(\'slide\')">이 슬라이드 다시 만들기 (AI)</button>'
  +(tg?'<button class="btn sm" onclick="runRegen(\'notes\')">노트 길이 맞추기 (AI)</button>':'')
  +(f.verdict==='long'?'<button class="btn sm" onclick="trimNotes()">문장 덜어 줄이기 (비용 0)</button>':'')
  +(S.undo&&S.undo.deck===S.deck&&S.undo.sel===S.sel?'<button class="btn sm" onclick="undoSlide()">되돌리기('+esc(S.undo.label)+')</button>':'')+'</div></div>';
}

function lines(a){return (a||[]).join('\n');}

  if(s.layout==='table')extra='<label class="f" style="margin-top:14px">표(첫 줄 머리글, 칸은 " | " 로 구분)<textarea data-k="table" style="min-height:140px">'+esc([((s.table&&s.table.header)||[]).join(' | ')].concat(((s.table&&s.table.rows)||[]).map(r=>r.join(' | '))).join('\n'))+'</textarea></label>';

  return '<div class="row" style="margin-bottom:14px"><button class="btn sm" onclick="moveSlide(-1)">위로</button><button class="btn sm" onclick="moveSlide(1)">아래로</button><button class="btn sm" onclick="dupSlide()">복제</button><button class="btn sm" onclick="delSlide()">삭제</button><span class="tb-sp"></span><span class="muted">'+(S.sel+1)+'번 슬라이드</span></div>'

  +'<label class="f" style="margin-top:14px">제목 — 주장 문장으로<input type="text" data-k="headline" value="'+esc(s.headline)+'"></label>'
  +'<label class="f" style="margin-top:14px">부제<input type="text" data-k="sub" value="'+esc(s.sub)+'"></label>'
  +(s.layout==='two_col'?'':'<label class="f" style="margin-top:14px">불릿(한 줄에 하나)<textarea data-k="bullets">'+esc(lines(s.bullets))+'</textarea></label>')+extra
  +'<label class="f" style="margin-top:14px">핵심 문장(아래 강조 띠)<input type="text" data-k="takeaway" value="'+esc(s.takeaway)+'"></label>'

function setField(k,v){
  const s=S.deck.slides[S.sel];const split=x=>x.split('\n').map(y=>y.trim()).filter(Boolean);
  if(k==='bullets'||k==='sources')s[k]=split(v);
  else if(k==='left.title'||k==='right.title'){const side=k.split('.')[0];s[side]=s[side]||{title:'',bullets:[]};s[side].title=v;}
  else if(k==='left.bullets'||k==='right.bullets'){const side=k.split('.')[0];s[side]=s[side]||{title:'',bullets:[]};s[side].bullets=split(v);}
  else if(k==='kpis')s.kpis=split(v).slice(0,EPA.LIMIT.kpis).map(l=>{const p=l.split('|').map(x=>x.trim());return {value:p[0]||'',label:p[1]||'',note:p[2]||''};});
  else if(k==='steps')s.steps=split(v).slice(0,EPA.LIMIT.steps).map(l=>{const p=l.split('|').map(x=>x.trim());return {title:p[0]||'',desc:p[1]||''};});
  else if(k==='table'){const rows=split(v).map(l=>l.split('|').map(x=>x.trim()));s.table={header:rows[0]||[],rows:rows.slice(1,1+EPA.LIMIT.tableRows)};}
  else s[k]=v;
  if(k==='notes'){s.seconds=EPA.secondsOf(v);const e=$('#secs');if(e)e.textContent='약 '+s.seconds+'초';const fm=$('#fitMsg'),tg=slideTarget();if(fm&&tg){const f=EPA.notesFit(v,tg);fm.textContent='목표 약 '+tg+'초(±10% = '+f.minChars+'~'+f.maxChars+'자) · 지금 약 '+f.seconds+'초 '+({ok:'✓ 맞음',short:'· 짧음',long:'· 김'})[f.verdict];}}
  if(k==='layout'){if(v==='two_col'&&!s.left){s.left={title:'',bullets:s.bullets.slice(0,Math.ceil(s.bullets.length/2))};s.right={title:'',bullets:s.bullets.slice(Math.ceil(s.bullets.length/2))};}if(v==='kpi'&&!s.kpis)s.kpis=[];if(v==='table'&&!s.table)s.table={header:[],rows:[]};if(v==='process'&&!s.steps)s.steps=[];render();}
}
function moveSlide(d){const a=S.deck.slides,i=S.sel,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];S.sel=j;render();}

function delSlide(){const a=S.deck.slides;if(a.length<=1)return;if(!confirm((S.sel+1)+'번 슬라이드를 지울까요?'))return;a.splice(S.sel,1);S.sel=Math.max(0,S.sel-1);render();}

function reqList(){return S.analysis?EPA.normalizeRequirements(S.analysis).requirements:[];}

function critNames(){const o={};((S.prop.criteria&&S.prop.criteria.items)||[]).forEach(c=>o[c.id]=c.name);return o;}
function critText(n,names){return n.criteria.map(c=>(names[c.id]||c.id)+' '+c.share+'점').join(', ');}
function curNode(){const o=S.prop.outline;return o?o.nodes.find(x=>x.id===S.prop.sel)||null:null;}

function buildPlan(){
  const P=S.prop;let raw=null,src='';
  if(P.criteriaText.trim()){raw=EPA.parseCriteriaText(P.criteriaText);src='붙여 넣은 평가표';}
  else if(S.analysis){raw=S.analysis;src='3002 분석 결과';}
  else{toast('평가표를 붙여 넣거나 1번 화면에서 3002 분석 결과(JSON)를 가져와 주세요.');return;}
  const c=EPA.normalizeCriteria(raw);
  if(!c.items.length){toast('평가항목을 찾지 못했습니다 — 한 줄에 "항목명 배점" 으로 넣어 주세요.');return;}
  if(!(Number(P.totalPages)>0)){toast('총 쪽수를 넣어 주세요.');return;}
  const o=EPA.allocatePages(EPA.buildOutline(c,{fixedOutline:P.fixedText.trim()||null}),Number(P.totalPages),{step:P.step});
  const k=EPA.keepDrafts(o,P.drafts);
  P.criteria=c;P.outline=o;P.drafts=k.drafts;P.sel=null;
  toast(src+' → 섹션 '+o.nodes.length+'개'+(k.dropped.length?' · 목차와 맞지 않는 초안 '+k.dropped.length+'개를 뺐습니다':''));render();
}

function blockHtml(b){

}

const TELE={on:false};

function agoText(t){if(!t)return '-';const m=Math.round((Date.now()-t)/6e4);return m<1?'방금':m<60?m+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전';}

/* 쪽 그림 보관 — 이 브라우저의 IndexedDB 에만(외부 전송 없음). 키: 발표본 id/p쪽번호 */
const IMG={};
function idbOpen(){return new Promise((ok,no)=>{const r=indexedDB.open('epa_pages',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
function idbDo(mode,fn){return idbOpen().then(db=>new Promise((ok,no)=>{const tx=db.transaction('p',mode),r=fn(tx.objectStore('p'));tx.oncomplete=()=>{db.close();ok(r&&r.result);};tx.onerror=()=>{db.close();no(tx.error);};}));}
const idbPut=(k,v)=>idbDo('readwrite',st=>st.put(v,k));
const idbGet=k=>idbDo('readonly',st=>st.get(k));
const idbDelDeck=id=>idbDo('readwrite',st=>st.delete(IDBKeyRange.bound(id+'/',id+'/\uffff')));
function imgKey(s){return S.deck&&S.deck.meta.id&&s&&s.img?S.deck.meta.id+'/'+s.img:'';}
async function loadDeckImages(){
  if(!S.deck||!S.deck.meta.id||!window.indexedDB)return;let n=0;
  for(const s of S.deck.slides){const k=imgKey(s);if(!k||IMG[k])continue;try{const b=await idbGet(k);if(b){IMG[k]=URL.createObjectURL(b);n++;}}catch(e){break;}}
  if(n)render();
}
/* 이미 만든 발표(PDF) 가져오기 — 쪽 글로 발표본을 만들거나, 지금 가져온 PPTX 에 쪽 그림만 붙인다. 쪽 그림은 2배 안팎(가로 최대 1600px) JPEG */
async function importDeckPdf(file){
  if(!file)return;if(!window.pdfjsLib){toast('PDF 라이브러리를 불러오지 못했습니다.');return;}
  if(file.size>200*1024*1024){toast('200MB 이하 PDF 만 가져올 수 있습니다.');return;}
  try{
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,n=pdf.numPages;
    if(n>300)throw new Error('300쪽까지만 가져옵니다');
    const attach=!!(S.deck&&S.deck.meta.imported&&/\.pptx$/i.test(S.deck.meta.imported))&&confirm('지금 발표본('+S.deck.meta.imported+')에 이 PDF 의 쪽 그림만 붙일까요? 노트·Part 는 그대로 둡니다.\n[취소]를 누르면 PDF 로 새 발표본을 만듭니다.');
    let deck;
    if(attach){deck=S.deck;const r=EPA.attachPageImages(deck,n);if(!r.ok){toast(r.msg);return;}}
    else{
      const pages=[];
      for(let p=1;p<=n;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();pages.push({num:p,lines:EPA.pdfTextLines(tc.items)});if(p%5===0)toast('쪽 글 읽는 중 '+p+' / '+n);}
      const r=EPA.pdfToDeck(pages,{fileName:file.name,minutes:S.minutes});
      if(!r.deck)throw new Error(r.warnings.join(' / '));
      if(S.deck&&!confirm('지금 발표본을 PDF 발표('+r.deck.slides.length+'장)로 바꿀까요?\n지금 발표본은 보관 목록에 남겨 둡니다.'))return;
      if(S.deck)savePracticeDeck();
      deck=r.deck;
    }
    if(!deck.meta.id)deck.meta.id='d'+Date.now().toString(36);
    let saved=0,failed=0;
    for(let p=1;p<=n;p++){
      if(!deck.slides.some(s=>s.img==='p'+p))continue;
      try{
        const pg=await pdf.getPage(p),vp0=pg.getViewport({scale:1}),sc=Math.min(2.5,1600/vp0.width),vp=pg.getViewport({scale:sc});
        const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
        const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);/* print: 화면 갱신 주기(rAF)를 쓰지 않아 다른 탭으로 가도 멈추지 않는다 */await pg.render({canvasContext:cx,viewport:vp,intent:'print'}).promise;
        const blob=await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.85));
        const k=deck.meta.id+'/p'+p;if(IMG[k])URL.revokeObjectURL(IMG[k]);IMG[k]=URL.createObjectURL(blob);
        try{await idbPut(k,blob);saved++;}catch(e){failed++;}
      }catch(e){failed++;}
      toast('쪽 그림 만드는 중 '+p+' / '+n);
    }
    S.deck=deck;S.sel=0;S.pick=[];S.pf='all';savePracticeDeck();
    toast((attach?'쪽 그림 '+saved+'장을 붙였습니다':deck.slides.length+'장을 가져왔습니다 · 쪽 그림 '+saved+'장')+(failed?' · 저장 못 한 그림 '+failed+'장(새로고침하면 글 카드로 보입니다)':'')+(attach?'':' · 대본(노트)은 비어 있습니다'));
    go('practice');
  }catch(e){toast('PDF 를 읽지 못했습니다: '+e.message);}

async function runMeta(){
  if(!S.deck)return;const a=aiState();

  const m=aiMask(pr.user);pr.user=m.masked;
  busy(true,'발표를 분석하는 중','AI 응답을 기다리고 있습니다.');
  try{
    const r=await callLLM(pr.system,pr.user,4000,n=>{$('#busyM').textContent='받은 글자 '+fmt(n)+'자';},'발표 분석');
    S.lastUsage=r.usage;let raw=EPA.parseJSON(r.text);if(raw&&S.maskOrg)raw=unmask(raw,m.map);
    const nm=EPA.normalizeMeta(raw,S.deck);keepDeckUndo('발표 분석');
    EPA.applyMeta(S.deck,nm.meta);savePracticeDeck();busy(false);
    toast('발표 분석을 적용했습니다 — Part·강조·간지'+(nm.warnings.length?' · '+nm.warnings[0]:''));render();
  }catch(e){busy(false);if(e.message!=='__CANCEL__')toast('분석 실패: '+e.message);}
}

  else if(a==='inkclear')inkClear();
  else if(a==='help'){TELE.help=!TELE.help;$('#teleHelp').hidden=!TELE.help;}else if(a==='exit')teleEnd(false);
}
function teleKey(e){
  if(!TELE.on)return;
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const k=e.key;let used=true;
  if(TELE.help){TELE.help=false;$('#teleHelp').hidden=true;e.preventDefault();e.stopPropagation();return;}
  if(TELE.rating){if(/^[1-5]$/.test(k))teleRate(k);else if(k==='Escape')teleRate('skip');else if(k==='r'||k==='R')teleRate('again');else if(k==='Enter'){}else used=false;}
  else if(k===' '||k==='ArrowRight'||k==='PageDown')teleNextReq();
  else if(k==='ArrowLeft'||k==='PageUp')teleGo(-1);
  else if(k==='a'||k==='A')teleAct('auto');
  else if(k==='k'||k==='K')teleTogglePause();
  else if(k==='ArrowUp'||k==='ArrowDown'){TELE.font=Math.min(56,Math.max(24,TELE.font+(k==='ArrowUp'?2:-2)));lsSet('epa_tele_font',TELE.font);teleLayout();}
  else if(k==='+'||k==='='||k==='-'||k==='_'){TELE.speed=Math.round(Math.min(2,Math.max(0.5,TELE.speed+(k==='-'||k==='_'?-0.1:0.1)))*10)/10;lsSet('epa_tele_speed',TELE.speed);toast('스크롤 속도 '+TELE.speed+'x');}
  else if(k==='r'||k==='R'){const sc=$('#teleScript');if(sc)sc.scrollTop=0;}
  else if(k==='t'||k==='T'){teleReset(true);toast('시간을 처음부터 잽니다');}
  else if(k==='b'||k==='B'||k==='.'){TELE.black=!TELE.black;$('#teleBlack').hidden=!TELE.black;audSync();}
  else if(k==='p'||k==='P')audOpen();
  else if(k==='f'||k==='F')teleAct('full');
  else if(k==='h'||k==='H'||k==='?')teleAct('help');
  else if(k==='d'||k==='D')inkTool('pen');
  else if(k==='g'||k==='G')inkTool('hl');
  else if(k==='e'||k==='E')inkTool('eraser');
  else if(k==='c'||k==='C')inkClear();
  else if(k==='Escape'){if(TELE.tool)inkTool('');else teleEnd(false);}
  else used=false;
  if(used){e.preventDefault();e.stopPropagation();}
}

async function sha32(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,32);}

async function ttsBlob(text,set){

    if(!r.ok)throw new Error('음성 오류 '+r.status+': '+(await r.text()).slice(0,160));

}

  document.querySelectorAll('.slide-item[data-i]').forEach(b=>b.addEventListener('click',()=>{S.sel=+b.dataset.i;render();}));
  /* 2단계 제안서 */
  on('#prCrit','input',e=>S.prop.criteriaText=e.target.value);on('#prFixed','input',e=>S.prop.fixedText=e.target.value);
  on('#prPages','change',e=>S.prop.totalPages=+e.target.value);on('#prStep','change',e=>S.prop.step=e.target.value==='0.5'?0.5:1);
  on('#prLib','change',e=>{setLibrary(e.target.value);regroundDrafts();});on('#prPaste','input',e=>S.prop.paste=e.target.value);
  on('#impProp','change',e=>e.target.files[0]&&importProp(e.target.files[0]));
  document.querySelectorAll('[data-pg]').forEach(el=>el.addEventListener('change',()=>patchLeaf(el.dataset.pg,{pages:el.value})));
  document.querySelectorAll('[data-lock]').forEach(el=>el.addEventListener('change',()=>patchLeaf(el.dataset.lock,{locked:el.checked})));
  document.querySelectorAll('[data-sec]').forEach(b=>b.addEventListener('click',()=>{S.prop.sel=b.dataset.sec;S.prop.paste='';render();}));
  [['#dTitle','title'],['#dSub','subtitle'],['#dDate','date'],['#dClient','client'],['#dCompany','company']].forEach(([s,k])=>on(s,'input',e=>S.prop.meta[k]=e.target.value));
  on('#dNum','change',e=>S.prop.numbering=e.target.value==='korean'?'korean':'decimal');on('#dMarks','change',e=>S.prop.reviewMarks=e.target.checked);
  /* 발표 연습 */
  document.querySelectorAll('[data-pf]').forEach(b=>b.addEventListener('click',()=>{S.pf=b.dataset.pf;render();}));
  document.querySelectorAll('[data-pick]').forEach(c=>c.addEventListener('change',()=>{const i=+c.dataset.pick;S.pick=(S.pick||[]).filter(x=>x!==i);if(c.checked)S.pick.push(i);render();}));
  document.querySelectorAll('[data-tele]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.tele;teleOpen('tele',EPA.practiceFilter(S.deck,S.pf||'all').filter(x=>x>=i));}));
  document.querySelectorAll('[data-goedit]').forEach(b=>b.addEventListener('click',()=>{S.sel=+b.dataset.goedit;go('edit');}));
  on('#ttsVoice','change',e=>lsSet('epa_tts_voice',e.target.value));on('#ttsProv','change',e=>{ttsSave({provider:e.target.value});render();});on('#ttsModel','change',e=>{ttsSave({model:e.target.value});render();});on('#ttsAiVoice','change',e=>ttsSave({voice:e.target.value}));on('#ttsStyle','change',e=>ttsSave({style:e.target.value}));
  on('#ttsKey','change',e=>{try{sessionStorage.setItem('epa_tts_key_'+ttsSet().provider,e.target.value.trim());}catch(x){}render();});on('#ttsRate','change',e=>lsSet('epa_tts_rate',e.target.value));
  on('#ckMust','change',e=>{S.check.must=e.target.value;render();});on('#ckBan','change',e=>{S.check.banned=e.target.value;render();});
  on('#xStrip','change',e=>S.stripGuides=e.target.checked);
  on('#impPptx','change',e=>importDeckPptx(e.target.files[0]));on('#impQa','change',e=>importQa(e.target.files[0]));on('#impPdf','change',e=>importDeckPdf(e.target.files[0]));
  document.querySelectorAll('[data-part]').forEach(c=>c.addEventListener('change',()=>setPart(+c.dataset.part,c.value)));
  document.querySelectorAll('[data-emph]').forEach(c=>c.addEventListener('change',()=>{const s=S.deck.slides[+c.dataset.emph];if(!s)return;if(c.checked)s.emphasis=true;else delete s.emphasis;savePracticeDeck();render();}));
  on('#aiScope','change',e=>{aiState().scope=e.target.value;render();});on('#aiTone','change',e=>{aiState().tone=e.target.value;render();});on('#aiPresales','change',e=>{aiState().presales=e.target.value.slice(0,3000);render();});
  on('#partRate','change',e=>{const v=+e.target.value/100;if(v===1)delete S.deck.meta.rate;else S.deck.meta.rate=v;savePracticeDeck();render();});
  document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',e=>{setField(el.dataset.k,e.target.value);if(el.dataset.k==='headline'){const it=document.querySelector('.slide-item.on .t');if(it)it.textContent=(S.sel+1)+'. '+e.target.value;}}));
}
render();
if(location.hash==='#demo')runDemo(); /* 주소 끝 #demo — 비용 없이 데모 바로 열기(시연·캡처용) */
else if(/^#demo-proposal/.test(location.hash)){runDemoProp();const dv=location.hash.split(':')[1];if(dv==='draft'||dv==='docx')go(dv);} /* #demo-proposal[:draft|:docx] — 2단계 데모 */
</script>
</body>
</html>
