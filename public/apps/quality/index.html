<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>제안 품질관리 · Proposal QA Studio</title>
<!-- 오프라인: 폰트/라이브러리 로컬 내장 (assets/) -->
<script src="assets/pdf.min.js"></script>
<script src="assets/mammoth.browser.min.js"></script>
<script src="assets/jszip.min.js"></script>
<style>
/* 오프라인 로컬 폰트 */
@font-face{font-family:'Pretendard';font-weight:100 900;font-style:normal;font-display:swap;src:local('Pretendard Variable'),url('../_shared/PretendardVariable.woff2') format('woff2');}
:root{
  /* CX Suite 통합 디자인 시스템 v1 — eum-app 실측(웜 페이퍼 + 화이트 카드 + 코럴) */
  --bg:#f5f4f2;
  --surface:#ffffff;
  --surface-2:#faf9f7;
  --line:#eee6dc;
  --line-strong:#e2d8ca;
  --ink:#1b1712;
  --ink-soft:#46464e;
  --ink-mute:#71717a;
  --primary:#e15a33;
  --primary-deep:#c74a28;
  --primary-soft:#fbe9e2;
  --teal:#0fae9c;
  --teal-soft:#e3f7f4;
  --violet:#7b4ce0;
  --amber:#e89a2b;
  --rose:#e5484d;
  --green:#1fa971;
  --green-soft:#e6f6ee;
  --amber-soft:#fcf2e0;
  --rose-soft:#fdeaea;
  --shadow-sm:0 1px 2px rgba(22,20,16,.05),0 1px 3px rgba(22,20,16,.04);
  --shadow:0 4px 16px rgba(22,20,16,.06),0 1px 4px rgba(22,20,16,.05);
  --shadow-lg:0 18px 50px rgba(22,20,16,.10),0 6px 16px rgba(22,20,16,.06);
  --r-s:10px; --r-m:16px; --r-l:22px;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  overflow:hidden;
}
::selection{background:var(--primary);color:#fff}
.mono{font-family:var(--mono);font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}

/* ===== Layout shell ===== */
#app{display:grid;grid-template-columns:248px 1fr;height:100vh}
.sidebar{
  background:var(--surface-2);border-right:1px solid var(--line);
  color:var(--ink-soft);display:flex;flex-direction:column;position:relative;overflow:hidden;
}
.sidebar::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(420px 280px at 20% -5%,rgba(225,90,51,.05),transparent 60%),
             radial-gradient(360px 320px at 110% 30%,rgba(15,174,156,.05),transparent 55%);
  pointer-events:none;
}
.brand{padding:24px 22px 18px;position:relative;z-index:1}
.brand .logo{display:flex;align-items:center;gap:11px;border-radius:12px;transition:.15s}
.brand .logo:hover{opacity:.85}
.brand .mark{
  width:34px;height:34px;border-radius:11px;flex:none;position:relative;
  background:linear-gradient(135deg,#2f5ff4,#0fae9c);
  box-shadow:0 8px 22px rgba(27,69,214,.45);
  display:grid;place-items:center;
}
.brand .mark svg{width:21px;height:21px}
.brand h1{font-size:14px;letter-spacing:-.4px;color:var(--ink);font-weight:700}
.brand .sub{font-size:9.5px;color:var(--ink-mute);letter-spacing:.5px;margin-top:2px;font-weight:500}

.nav{padding:8px 12px;position:relative;z-index:1;flex:1;overflow-y:auto}
.nav-label{font-size:10.5px;letter-spacing:1.3px;color:var(--ink-mute);font-weight:700;padding:14px 12px 7px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;
  color:var(--ink-soft);font-size:13.5px;font-weight:600;letter-spacing:-.2px;position:relative;
  transition:.18s;margin-bottom:2px;
}
.nav-item .ico{width:19px;height:19px;flex:none;opacity:.85}
.nav-item .ord{
  margin-left:auto;font-size:10px;font-family:var(--mono);color:var(--ink-mute);
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;
}
.nav-item:hover{background:var(--surface);color:var(--ink)}
.nav-item.active{background:var(--primary-soft);color:var(--primary)}
.nav-item.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--primary),var(--primary-deep))}
.nav-item.active .ico{opacity:1}
.nav-item .badge{margin-left:auto;font-size:10px;background:var(--teal);color:#04241f;font-weight:800;border-radius:20px;padding:2px 7px}

.side-foot{padding:14px;position:relative;z-index:1}
.token-pill{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;
}
.token-pill .tp-top{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--ink-mute);font-weight:700;letter-spacing:.4px}
.token-pill .tp-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(15,174,156,.18);animation:pulse 2s infinite}
.token-pill .tp-val{font-family:var(--mono);font-size:21px;color:var(--ink);font-weight:600;margin-top:6px;letter-spacing:-.5px}
.token-pill .tp-sub{font-size:10.5px;color:var(--ink-mute);margin-top:1px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== Main ===== */
.main{overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.topbar{
  height:62px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;
  padding:0 30px;gap:16px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);z-index:5;
}
.crumb{font-size:12px;color:var(--ink-mute);font-weight:600}
.crumb b{color:var(--ink)}
.topbar .title{font-size:16px;font-weight:800;letter-spacing:-.4px}
.tb-spacer{flex:1}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{font-size:12px;font-weight:700;color:var(--ink-soft);padding:6px 13px;border-radius:8px;transition:.15s;letter-spacing:-.2px}
.seg button.on{background:#fff;color:var(--primary);box-shadow:var(--shadow-sm)}
.tb-btn{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-soft);padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;transition:.15s}
.tb-btn:hover{border-color:var(--line-strong);background:var(--surface)}
.tb-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.tb-btn.primary:hover{background:var(--primary-deep)}
.cancel-btn{border-color:#f3c9cb;color:var(--rose)}
.cancel-btn:hover{background:var(--rose-soft);border-color:var(--rose)}
.cancel-btn:disabled{opacity:.6;cursor:default}
.err-banner{display:flex;gap:13px;align-items:flex-start;background:var(--rose-soft);border:1px solid #f3c9cb;border-left:4px solid var(--rose);border-radius:var(--r-m);padding:15px 16px;margin-bottom:16px}
.err-banner .eb-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#fff;color:var(--rose);flex:none}
.err-banner .eb-ic svg{width:18px;height:18px}
.err-banner .eb-body{flex:1;min-width:0}
.err-banner .eb-h{font-size:13.5px;font-weight:800;color:#9d1f23}
.err-banner .eb-meta{font-size:11px;font-weight:600;color:var(--ink-mute);margin-left:6px}
.err-banner .eb-msg{font-size:11.5px;color:#7a2a2d;background:#fff;border:1px solid #f0d2d3;border-radius:8px;padding:8px 10px;margin-top:8px;word-break:break-word;white-space:pre-wrap;line-height:1.5}
.err-banner .eb-tip{font-size:11.5px;color:#8a3338;font-weight:600;margin-top:7px;line-height:1.55}
.err-banner .eb-x{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--rose);flex:none}
.err-banner .eb-x:hover{background:#fff}
.err-banner .eb-x svg{width:14px;height:14px}
.pg{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--ink-mute);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.risk .rt .pg{margin-left:6px}
.typo-kind{font-size:10px;font-weight:800;color:var(--violet);background:#f0eaff;border-radius:6px;padding:2px 7px;white-space:nowrap}
.evrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.evrow:last-child{border-bottom:none}
.evrow .evdot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px}
.evrow .evt{font-size:13px;font-weight:800;color:var(--ink)}
.evrow .evc{font-size:11.5px;color:var(--ink-soft);line-height:1.55;margin-top:2px}
.tb-btn svg{width:15px;height:15px}

.scroll{overflow-y:auto;flex:1;scroll-behavior:smooth}
.scroll::-webkit-scrollbar{width:10px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:3px solid var(--bg)}
.view{padding:28px 30px 60px;max-width:1320px;margin:0 auto}
.view[hidden]{display:none}

/* reveal */
.rv{opacity:0;transform:translateY(14px);animation:rv .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rv{to{opacity:1;transform:none}}

/* cards / grid */
.grid{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-sm);position:relative}
.card.pad{padding:20px 22px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.card-h h3{font-size:14px;font-weight:800;letter-spacing:-.3px}
.card-h .hint{font-size:11px;color:var(--ink-mute);margin-left:auto;font-weight:600}
.card-h .tag{font-size:10px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:7px;background:var(--primary-soft);color:var(--primary)}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px;box-shadow:var(--shadow-sm);overflow:hidden;position:relative}
.kpi .kl{font-size:12px;color:var(--ink-soft);font-weight:700;display:flex;align-items:center;gap:7px}
.kpi .kl .di{width:9px;height:9px;border-radius:3px}
.kpi .kv{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-1.5px;margin-top:8px;line-height:1}
.kpi .ks{font-size:11.5px;color:var(--ink-mute);margin-top:7px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .spark{position:absolute;right:-4px;bottom:-4px;width:96px;height:50px;opacity:.5}
.delta{font-weight:800;font-size:11px;padding:1px 6px;border-radius:6px}
.delta.up{color:var(--green);background:var(--green-soft)}
.delta.down{color:var(--rose);background:var(--rose-soft)}

.split{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.split-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}

/* gauge */
.gauge-wrap{display:flex;align-items:center;gap:22px}
.gauge{position:relative;width:168px;height:168px;flex:none}
.gauge .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .lbl .num{font-family:var(--mono);font-size:42px;font-weight:600;letter-spacing:-2px;line-height:1}
.gauge .lbl .cap{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:3px}
.grade-list{flex:1;display:flex;flex-direction:column;gap:11px}
.grade-row{display:flex;align-items:center;gap:10px;font-size:12.5px}
.grade-row .gn{color:var(--ink-soft);font-weight:700;width:96px;flex:none}
.gbar{flex:1;height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:6px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.grade-row .gp{font-family:var(--mono);font-weight:600;width:38px;text-align:right;font-size:12px}

/* radar */
.radar-box{display:flex;align-items:center;justify-content:center;padding:6px 0}

/* requirement matrix */
.req-table{width:100%;border-collapse:collapse;font-size:12.5px}
.req-table th{text-align:left;font-size:10.5px;letter-spacing:.5px;color:var(--ink-mute);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase}
.req-table td{padding:11px 10px;border-bottom:1px solid var(--surface-2);vertical-align:top}
.req-table tr:last-child td{border-bottom:none}
.req-table tr:hover td{background:var(--surface)}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.st.met{background:var(--green-soft);color:var(--green)}
.st.partial{background:var(--amber-soft);color:#b9761a}
.st.missing{background:var(--rose-soft);color:var(--rose)}
.st .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.must{font-size:9.5px;font-weight:800;color:var(--primary);background:var(--primary-soft);padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}

/* risk */
.risk{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--surface-2)}
.risk:last-child{border-bottom:none}
.risk .rl{width:4px;border-radius:4px;flex:none}
.risk.high .rl{background:var(--rose)} .risk.mid .rl{background:var(--amber)} .risk.low .rl{background:var(--teal)}
.risk .rt{font-size:13px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.risk .lv{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px}
.risk.high .lv{background:var(--rose-soft);color:var(--rose)} .risk.mid .lv{background:var(--amber-soft);color:#b9761a} .risk.low .lv{background:var(--teal-soft);color:#0a7f72}
.risk .rd{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.55}
.risk .ra{font-size:11.5px;color:var(--primary);margin-top:5px;font-weight:700;display:flex;align-items:center;gap:5px}

.chiplist{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft)}
.chip.good{background:var(--green-soft);border-color:#cdebda;color:#147a52}

/* ===== Upload view ===== */
.sector-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.sector{
  border:1.5px solid var(--line);border-radius:var(--r-m);padding:18px 20px;cursor:pointer;
  transition:.18s;background:#fff;position:relative;overflow:hidden;
}
.sector:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:var(--shadow)}
.sector.sel{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.sector .si{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px}
.sector .si svg{width:22px;height:22px;color:#fff}
.sector h4{font-size:15px;font-weight:800;letter-spacing:-.3px}
.sector p{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.5}
.sector .focus{margin-top:11px;display:flex;flex-wrap:wrap;gap:5px}
.sector .focus span{font-size:10px;font-weight:700;color:var(--ink-mute);background:var(--surface);border-radius:6px;padding:3px 7px}
.sector .check{position:absolute;top:16px;right:16px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:.18s}
.sector.sel .check{background:var(--primary);border-color:var(--primary)}
.sector.sel .check svg{opacity:1}
.sector .check svg{width:12px;height:12px;color:#fff;opacity:0}

.fmt-guide{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.fmt-guide .fg-row{display:flex;gap:11px;align-items:flex-start;padding:8px 0}
.fmt-guide .fg-ic{width:24px;height:24px;border-radius:8px;flex:none;display:grid;place-items:center;margin-top:1px}
.fmt-guide .fg-ic svg{width:15px;height:15px}
.fmt-guide .fg-row.ok .fg-ic{background:var(--green-soft);color:#147a52}
.fmt-guide .fg-row.warn .fg-ic{background:var(--amber-soft);color:#9a6411}
.fmt-guide .fg-row b{font-size:12.5px;font-weight:800;color:var(--ink-soft)}
.fmt-guide .fg-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.fmt-guide .fg-tags span{font-size:11px;font-weight:700;border-radius:7px;padding:3px 9px;font-family:var(--mono)}
.fmt-guide .fg-tags span i{font-style:normal;font-weight:600;opacity:.7;font-size:10px;margin-left:3px}
.fmt-guide .fg-row.ok .fg-tags span{background:var(--green-soft);color:#147a52}
.fmt-guide .fg-row.warn .fg-tags span{background:var(--amber-soft);color:#9a6411}
.fmt-guide .fg-note{font-size:11.5px;color:var(--ink-soft);line-height:1.65;margin-top:10px;padding-top:12px;border-top:1px dashed var(--line)}
.fmt-guide .fg-note b{color:var(--primary);font-weight:700}
.drops{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.drop{
  border:1.5px dashed var(--line-strong);border-radius:var(--r-m);padding:22px 18px;text-align:center;
  transition:.18s;background:var(--surface);cursor:pointer;position:relative;min-height:172px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
}
.drop:hover{border-color:var(--primary);background:var(--primary-soft)}
.drop.over{border-color:var(--primary);background:var(--primary-soft);transform:scale(1.01)}
.drop.has{border-style:solid;border-color:var(--green);background:var(--green-soft)}
.drop .dic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:12px;background:#fff;box-shadow:var(--shadow-sm)}
.drop .dic svg{width:23px;height:23px;color:var(--primary)}
.drop.has .dic svg{color:var(--green)}
.drop h5{font-size:13.5px;font-weight:800}
.drop .req-mark{font-size:9.5px;color:var(--rose);font-weight:800;margin-left:5px}
.drop .pick-mark{font-size:9px;color:var(--primary);font-weight:800;margin-left:5px;background:var(--primary-soft);padding:2px 6px;border-radius:5px;vertical-align:middle}
.drop .opt-mark{font-size:9px;color:var(--ink-mute);font-weight:800;margin-left:5px;background:var(--surface);padding:2px 6px;border-radius:5px;vertical-align:middle}
.scope-note{display:flex;align-items:center;gap:10px;background:var(--primary-soft);border:1px solid #d3deff;border-radius:12px;padding:11px 15px;margin-bottom:16px;font-size:12.5px;color:#2a3a66;line-height:1.5}
.scope-note svg{width:18px;height:18px;color:var(--primary);flex:none}
.scope-note b{font-weight:800;color:var(--primary-deep)}
.drop p{font-size:11.5px;color:var(--ink-soft);margin-top:5px}
.drop .fname{font-size:12px;font-weight:700;color:var(--ink);margin-top:8px;word-break:break-all;display:flex;align-items:center;gap:6px;justify-content:center}
.drop .fmeta{font-size:11px;color:var(--ink-mute);margin-top:3px;font-family:var(--mono)}
.drop .clear{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:8px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow-sm);opacity:0;transition:.15s}
.drop.has:hover .clear{opacity:1}
.drop .clear svg{width:13px;height:13px;color:var(--ink-soft)}

.budget-card{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.budget-card .bc-l{flex:1;min-width:280px}
.range-wrap{margin-top:14px}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:6px;background:var(--surface-2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);box-shadow:0 2px 8px rgba(27,69,214,.4);cursor:pointer;border:3px solid #fff}
.modesel{display:flex;gap:8px;margin-top:6px}
.modesel label{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer;transition:.15s}
.modesel label:hover{border-color:var(--line-strong)}
.modesel input{display:none}
.modesel input:checked+.mb{color:var(--primary)}
.modesel label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.modesel .mb b{font-size:13px;font-weight:800;display:block}
.modesel .mb span{font-size:11px;color:var(--ink-soft)}
.est-box{background:var(--ink);color:#fff;border-radius:var(--r-m);padding:18px 22px;min-width:230px}
.est-box .el{font-size:11px;color:#8fa2bd;font-weight:700;letter-spacing:.4px}
.est-box .ev{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-1px;margin-top:5px}
.est-box .save{font-size:11.5px;color:#46d6b9;font-weight:700;margin-top:8px;display:flex;align-items:center;gap:6px}
.est-box .erow{display:flex;justify-content:space-between;font-size:11px;color:#a9b8cd;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1)}

/* pipeline */
.pipe{display:flex;flex-direction:column;gap:0;margin-top:6px}
.pstep{display:flex;gap:14px;padding:14px 0;position:relative}
.pstep:not(:last-child)::after{content:"";position:absolute;left:17px;top:42px;bottom:-6px;width:2px;background:var(--line)}
.pstep.done:not(:last-child)::after{background:var(--green)}
.pstep .pi{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-mute);font-weight:800;font-family:var(--mono);font-size:14px;transition:.3s;z-index:1}
.pstep.active .pi{background:var(--primary);color:#fff;box-shadow:0 0 0 5px var(--primary-soft);animation:spinp 1s linear infinite}
.pstep.done .pi{background:var(--green);color:#fff}
@keyframes spinp{100%{box-shadow:0 0 0 8px transparent}}
.pstep .pc{flex:1;padding-top:6px}
.pstep .pt{font-size:13.5px;font-weight:800}
.pstep .pd{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.pstep .ptok{font-family:var(--mono);font-size:11px;color:var(--primary);font-weight:600;margin-left:auto}
.pstep.pending{opacity:.5}

/* api settings */
.api-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.api-card{border:1.5px solid var(--line);border-radius:var(--r-m);padding:18px 20px;background:#fff;transition:.18s}
.api-card.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.api-card .ach{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.api-card .alogo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.api-card h4{font-size:14px;font-weight:800}
.api-card .astat{margin-left:auto;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;background:var(--surface-2);color:var(--ink-mute)}
.api-card.on .astat{background:var(--green-soft);color:var(--green)}
label.fld{display:block;margin-bottom:12px}
label.fld .fl{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;background:var(--surface);transition:.15s;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
.inp.mono{font-family:var(--mono);font-size:12px}
select.inp{cursor:pointer}
.use-radio{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:700;color:var(--ink-soft)}

.notice{display:flex;gap:11px;background:var(--amber-soft);border:1px solid #f2dcae;border-radius:12px;padding:13px 16px;font-size:12px;color:#8a5e16;line-height:1.55;margin-top:18px}
.notice svg{width:17px;height:17px;flex:none;color:var(--amber);margin-top:1px}
.notice b{color:#6d4910}

.empty{text-align:center;padding:70px 20px;color:var(--ink-mute)}
.empty .ei{width:64px;height:64px;border-radius:18px;background:var(--surface);display:grid;place-items:center;margin:0 auto 16px}
.empty .ei svg{width:30px;height:30px;color:var(--ink-mute)}
.empty h3{font-size:16px;font-weight:800;color:var(--ink-soft)}
.empty p{font-size:13px;margin-top:6px}

/* ===== Welcome / onboarding dashboard ===== */
.hero{position:relative;overflow:hidden;border-radius:var(--r-l);padding:34px 34px 30px;color:var(--ink);
  background:linear-gradient(135deg,#fdf1ec 0%,#faf7f4 55%,#ffffff 100%);border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(520px 280px at 88% -20%,rgba(225,90,51,.12),transparent 60%),
  radial-gradient(420px 320px at -8% 120%,rgba(15,174,156,.1),transparent 55%);pointer-events:none}
.hero .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--primary);
  background:rgba(225,90,51,.1);border:1px solid rgba(225,90,51,.22);padding:6px 12px;border-radius:30px}
.hero .eyebrow .lvdot{width:6px;height:6px;border-radius:50%;background:#5fffd9;box-shadow:0 0 0 3px rgba(95,255,217,.25);animation:pulse 2s infinite}
.hero h2{font-size:29px;font-weight:800;letter-spacing:-.8px;margin-top:16px;line-height:1.25;position:relative}
.hero h2 b{color:var(--primary)}
.hero p.lead{font-size:14px;color:var(--ink-soft);margin-top:11px;max-width:620px;line-height:1.65;position:relative}
.hero .hcta{display:flex;gap:11px;margin-top:22px;flex-wrap:wrap;position:relative}
.hero .hbtn{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;padding:12px 20px;border-radius:12px;transition:.16s}
.hero .hbtn svg{width:17px;height:17px}
.hero .hbtn.solid{background:var(--primary);color:#fff}
.hero .hbtn.solid:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.hero .hbtn.ghost{background:#fff;color:var(--ink-soft);border:1px solid var(--line)}
.hero .hbtn.ghost:hover{background:var(--surface-2)}
.hero .hstat{position:absolute;right:34px;bottom:26px;display:flex;gap:26px}
.hero .hstat .hs{text-align:right}
.hero .hstat .hs .n{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.5px;display:block}
.hero .hstat .hs .l{font-size:10.5px;color:var(--ink-mute);font-weight:600;letter-spacing:.3px}

.ready-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.ready{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:15px 16px;box-shadow:var(--shadow-sm);transition:.15s}
.ready:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:var(--shadow)}
.ready .ri{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ready .ri svg{width:20px;height:20px}
.ready .rtxt{min-width:0}
.ready .rtxt .rt{font-size:12px;font-weight:700;color:var(--ink-soft)}
.ready .rtxt .rv2{font-size:14.5px;font-weight:800;letter-spacing:-.3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ready .rtxt .rv2 small{font-size:11px;font-weight:600;color:var(--ink-mute)}
.ready .rstate{margin-left:auto;flex:none;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px}
.rstate.ok{background:var(--green-soft);color:#147a52}
.rstate.no{background:var(--amber-soft);color:#9a6411}

.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;position:relative}
.flow .fstep{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:22px 20px;box-shadow:var(--shadow-sm);overflow:hidden;transition:.16s;cursor:pointer}
.flow .fstep:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-strong)}
.flow .fstep .num{font-family:var(--mono);font-size:42px;font-weight:600;color:var(--primary-soft);position:absolute;top:8px;right:16px;letter-spacing:-2px;line-height:1}
.flow .fstep .fic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--primary-soft);margin-bottom:14px}
.flow .fstep .fic svg{width:23px;height:23px;color:var(--primary)}
.flow .fstep h4{font-size:15px;font-weight:800;letter-spacing:-.3px}
.flow .fstep p{font-size:12.5px;color:var(--ink-soft);margin-top:7px;line-height:1.6}
.flow .fstep .fchips{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.flow .fstep .fchips span{font-size:10.5px;font-weight:700;color:var(--primary);background:var(--primary-soft);border-radius:7px;padding:3px 8px}
.flow .farr{position:absolute;top:50%;right:-11px;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;z-index:2}
.flow .farr svg{width:13px;height:13px;color:var(--ink-mute)}

.feat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.feat{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:20px 18px;box-shadow:var(--shadow-sm);transition:.16s}
.feat:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-strong)}
.feat .fi2{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:13px}
.feat .fi2 svg{width:20px;height:20px}
.feat h5{font-size:13.5px;font-weight:800;letter-spacing:-.3px}
.feat p{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.6}
.feat .fmetric{display:flex;align-items:baseline;gap:5px;margin-top:11px}
.feat .fmetric .fn{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.5px}
.feat .fmetric .fu{font-size:11px;font-weight:700;color:var(--ink-mute)}

@media(max-width:1100px){
  .ready-strip,.feat-row{grid-template-columns:1fr 1fr}
  .flow{grid-template-columns:1fr}
  .flow .farr{display:none}
  .hero .hstat{display:none}
}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:99;transition:.35s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast svg{width:17px;height:17px;color:var(--teal)}

.section-title{font-size:13px;font-weight:800;letter-spacing:-.2px;margin:26px 0 13px;display:flex;align-items:center;gap:9px}
.section-title .stbar{width:3px;height:15px;border-radius:3px;background:var(--primary)}
.section-title .stn{font-family:var(--mono);font-size:11px;color:var(--ink-mute);font-weight:500;margin-left:auto}

.fill{display:flex;align-items:center;justify-content:center;height:100%}
.spinner{width:30px;height:30px;border:3px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{100%{transform:rotate(360deg)}}

.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px}

.conf-band{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.conf-band .cbi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--green-soft);flex:none}
.conf-band .cbi svg{width:21px;height:21px;color:var(--green)}
.conf-band .cbt b{font-size:14px;font-weight:800}
.conf-band .cbt p{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.5}
.conf-band .cbv{margin-left:auto;text-align:right;flex:none}
.conf-band .cbv .n{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--green)}
.conf-band .cbv .l{font-size:10.5px;color:var(--ink-mute);font-weight:700}

.flag{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:12px}
.flag:last-child{border-bottom:none}
.flag .fi{width:18px;height:18px;flex:none;margin-top:1px}
.flag b{font-weight:800}
.flag .adj{font-family:var(--mono);font-weight:600;font-size:11px;padding:1px 7px;border-radius:6px;margin-left:auto;white-space:nowrap}
.flag .adj.minus{background:var(--rose-soft);color:var(--rose)} .flag .adj.plus{background:var(--green-soft);color:var(--green)}

/* report: exec summary + editable improvement board */
.exec{display:flex;gap:18px;align-items:stretch;margin-top:18px;background:linear-gradient(120deg,var(--primary-soft),#eafaf7);border:1px solid #d8e2ff;border-radius:var(--r-m);padding:16px 18px}
.exec-l{flex:1;min-width:0}
.exec-k{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--primary-deep)}
.exec-v{font-size:13px;color:#23314f;line-height:1.6;margin-top:6px;font-weight:600}
.exec-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.exec-r{display:flex;gap:16px;align-items:center;flex:none;padding-left:18px;border-left:1px solid #e2d8ca}
.exec-stat{text-align:center}
.exec-stat .n{font-size:20px;font-weight:600;color:var(--primary-deep);letter-spacing:-.5px}
.exec-stat .l{font-size:10px;font-weight:700;color:var(--ink-soft);margin-top:1px}
.rep-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 11px}
.rep-h h3{font-size:14px;font-weight:800}
.rep-h .rep-sub{font-size:11px;font-weight:600;color:var(--ink-mute)}
.top3{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:14px}
.top3-h{font-size:11px;font-weight:800;color:var(--ink-soft);letter-spacing:.3px;margin-bottom:8px}
.top3-row{display:flex;align-items:center;gap:9px;padding:5px 0}
.top3-n{width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.top3-t{font-size:12.5px;color:var(--ink);font-weight:600;line-height:1.45}
.imp-list{display:flex;flex-direction:column;gap:11px}
.imp-card{border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:12px 14px;background:#fff;transition:.15s}
.imp-card.pri-high{border-left-color:var(--rose)} .imp-card.pri-mid{border-left-color:var(--amber)} .imp-card.pri-low{border-left-color:var(--teal)}
.imp-card.done{opacity:.55;background:var(--surface)}
.imp-card.done .imp-edit{text-decoration:line-through;color:var(--ink-mute)}
.imp-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.imp-pri{font-size:10px;font-weight:800;padding:2px 9px;border-radius:20px}
.imp-pri.pri-high{background:var(--rose-soft);color:var(--rose)} .imp-pri.pri-mid{background:var(--amber-soft);color:#9a6411} .imp-pri.pri-low{background:var(--teal-soft);color:#0a7d70}
.imp-sel{font-size:10.5px;font-weight:800;border:1px solid var(--line);border-radius:7px;padding:3px 6px;color:var(--ink-soft);background:#fff;cursor:pointer}
.imp-src{font-size:11.5px;color:var(--ink-soft);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-done-l{font-size:11px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:5px;cursor:pointer;flex:none}
.imp-del{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--ink-mute);flex:none}
.imp-del:hover{background:var(--rose-soft);color:var(--rose)}
.imp-del svg{width:13px;height:13px}
.imp-edit{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.55;color:var(--ink);resize:none;background:var(--surface);transition:.15s;font-family:inherit}
.imp-edit:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
@media(max-width:760px){ .exec{flex-direction:column} .exec-r{border-left:none;border-top:1px solid #e2d8ca;padding-left:0;padding-top:12px;justify-content:space-around} }

.tb-logo{display:none;align-items:center;gap:9px;text-decoration:none;color:var(--ink);margin-right:4px}
.tb-logo-mark{width:32px;height:32px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb-logo-mark img{width:20px;height:20px;object-fit:contain;display:block}
.tb-logo-txt{display:flex;flex-direction:column;line-height:1.08}
.tb-logo-txt b{font-size:14px;font-weight:700;letter-spacing:-.3px}
.tb-logo-txt i{font-size:9.5px;font-weight:600;color:var(--ink-mute);letter-spacing:.6px;font-style:normal}
@media(max-width:1100px){
  #app{grid-template-columns:1fr}
  .sidebar{display:none}
  .tb-logo{display:flex}
  .kpi-row{grid-template-columns:1fr 1fr}
  .split,.api-grid,.sector-row,.drops,.split-3{grid-template-columns:1fr}
}
/* ---------- 최근 분석 결과 (브라우저 보관) — 2026-09-30 ---------- */
.saved-results{margin:18px 0;padding:14px 16px;border:1px solid #e6eaf2;border-radius:12px;background:#fff;font-size:13px;color:#1a2233}
.saved-results .sr-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.saved-results .sr-head span{color:#69738c;font-size:12px}
.saved-results .sr-head .sr-clear{margin-left:auto}
.saved-results .sr-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #eef1f8;flex-wrap:wrap}
.saved-results .sr-t{font-weight:700;min-width:6em;overflow-wrap:anywhere}
.saved-results .sr-d,.saved-results .sr-c{color:#69738c;font-size:12px;font-variant-numeric:tabular-nums}
.saved-results button{border:1px solid #d8dde8;background:#fafbfe;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;color:#1a2233}
.saved-results button:hover{background:#eef2fb}
.saved-results button:focus-visible{outline:2px solid #3b6fe0;outline-offset:1px}
.saved-results .sr-row button:first-of-type{margin-left:auto}
</style>
</head>
<body>
<div id="app">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="brand">

/* ==== [2026-07-13] 외부 LLM 전송 통제: 마스킹·감사로깅·동의모달 (트랙2) ==== */
function maskSensitive(text,opts){opts=opts||{};if(text==null)return{masked:'',map:{},counts:{}};var s=String(text),map={},counts={},oneWay=!!opts.oneWay,seen=Object.create(null);
function token(kind,original){if(seen[original])return seen[original];counts[kind]=(counts[kind]||0)+1;var t='['+kind+'_'+counts[kind]+']';seen[original]=t;if(!oneWay)map[t]=original;return t;}
function sub(kind,re){s=s.replace(re,function(m){return token(kind,m);});}
function escapeRe(x){return String(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function subList(kind,list){if(!list||!list.length)return;var arr=list.filter(Boolean).map(String).sort(function(a,b){return b.length-a.length;});arr.forEach(function(name){if(name.trim().length<2)return;s=s.replace(new RegExp(escapeRe(name),'g'),function(m){return token(kind,m);});});}
subList('고객사',opts.orgNames);subList('인명',opts.personNames);
sub('이메일',/[\w.+-]+@[\w-]+\.[\w.-]+/g);sub('주민번호',/\b\d{6}-?[1-8]\d{6}\b/g);sub('사업자번호',/\b\d{3}-\d{2}-\d{5}\b/g);sub('전화',/\b(01[016789]|0\d{1,2})[-.\s]?\d{3,4}[-.\s]?\d{4}\b/g);sub('계좌',/\b\d{2,6}-\d{2,6}-\d{3,7}\b/g);
return{masked:s,map:map,counts:counts};}
var LLM_AUDIT_KEY='llmAuditLog',LLM_AUDIT_MAX=500;
function logExternalSend(entry){var rec={ts:new Date().toISOString(),app:entry.app||'',provider:entry.provider||'',endpointHost:entry.endpointHost||'',dataKinds:entry.dataKinds||[],fieldCount:entry.fieldCount||0,charCount:entry.charCount||0,maskApplied:!!entry.maskApplied,fileBase64Included:!!entry.fileBase64Included};
try{var arr=JSON.parse(localStorage.getItem(LLM_AUDIT_KEY)||'[]');arr.push(rec);if(arr.length>LLM_AUDIT_MAX)arr=arr.slice(arr.length-LLM_AUDIT_MAX);localStorage.setItem(LLM_AUDIT_KEY,JSON.stringify(arr));}catch(e){}
try{console.info('[LLM-AUDIT]',rec);}catch(e){}return rec;}
function hostOf(prov){return({claude:'api.anthropic.com',gpt:'api.openai.com',openai:'api.openai.com',gemini:'generativelanguage.googleapis.com'})[prov]||String(prov||'');}
function confirmExternalSend(info){info=info||{};var skipKey='llmConsentSkip:'+(info.provider||'');if(sessionStorage.getItem(skipKey)==='1')return Promise.resolve(true);
return new Promise(function(resolve){var ov=document.createElement('div');ov.className='llm-consent-overlay';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');
function ce(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var kinds=(info.dataKinds&&info.dataKinds.length)?info.dataKinds.join(', '):'(미지정)';
var warn=info.fileBase64Included?'<p class="llm-consent-warn">⚠ 첨부 원본(PDF/이미지)이 <b>마스킹 없이</b> 전송됩니다.</p>':'';
ov.innerHTML='<div class="llm-consent-box"><h3 class="llm-consent-title">외부 LLM 전송 확인</h3><p class="llm-consent-desc">아래 내용이 외부 제공사 서버로 전송됩니다.</p><ul class="llm-consent-list"><li>제공사: <b>'+ce(info.provider)+'</b> ('+ce(info.endpointHost)+')</li><li>데이터 종류: '+ce(kinds)+'</li><li>필드 수: <b>'+(info.fieldCount||0)+'</b></li><li>마스킹: <b>'+(info.maskApplied?'Y':'N')+'</b></li><li>첨부 원본 포함: <b>'+(info.fileBase64Included?'Y':'N')+'</b></li></ul>'+warn+'<label class="llm-consent-remember"><input type="checkbox" class="llm-consent-skip"/> 이 세션에서 재확인 생략</label><div class="llm-consent-actions"><button type="button" class="llm-consent-cancel">취소</button><button type="button" class="llm-consent-ok">전송 동의</button></div></div>';

/* ---------- 분석 결과 보관 (이 브라우저에만) — 2026-09-30 ----------
 * 왜: 지금은 새로고침하면 분석 결과가 사라진다. 서버·클라우드 없이 **이 브라우저에만** 둔다.
 * 저장하는 것: 분석 결과(S.result)와 다시 그리는 데 필요한 최소 맥락(섹터·모드·토큰 집계).
 * 저장하지 않는 것: RFP·제안서·발표본 **원문(S.docs)**. 화면이 쓰지 않고, 가장 민감하다.
 * 한도: 최근 10건 · 90일. 넘치면 오래된 것부터 버린다. 용량이 모자라면 오래된 것부터 줄여 다시 시도한다.
 * 데모 결과는 저장하지 않는다 — S._resultId 가 없으면 저장하지 않는다.
 * 키 이름을 앱별로 나눈다(qualibid_results_v1). PMS 포털 안에서는 3003·3004 가 **같은 오리진**이라
 * 같은 이름을 쓰면 서로 덮어쓴다. */
const RES_KEY='qualibid_results_v1', RES_MAX=10, RES_TTL=90*864e5;

function resList(){
  try{
    const a=JSON.parse(localStorage.getItem(RES_KEY)||'[]');
    if(!Array.isArray(a)) return [];
    const now=Date.now();
    // 다른 스크립트가 같은 키를 망가뜨렸을 수 있다 — 모양이 맞는 것만 받는다.
    return a.filter(x=>x&&typeof x.id==='string'&&/^r\d+$/.test(x.id)&&x.result&&typeof x.result==='object'&&(now-(+x.ts||0))<RES_TTL);
  }catch(e){ return []; }
}
function resWrite(a){
  try{ localStorage.setItem(RES_KEY, JSON.stringify(a.slice(0,RES_MAX))); return true; }
  catch(e){ lsFail(e,'분석 결과'); return false; }
}
function persistResult(){
  if(!S.result||!S._resultId) return;
  const sec=(typeof SECTORS!=='undefined'&&SECTORS[S.sector])||null;
  const a=resList().filter(x=>x.id!==S._resultId);
  a.unshift({id:S._resultId, ts:Date.now(), sector:S.sector, sectorLabel:(sec&&sec.label)||S.sector, mode:S.mode, confidence:S.result.confidence, result:S.result, tokens:S.tokens});
  // 용량이 모자라면 오래된 것부터 버려 가며 다시 쓴다. 한 건도 못 남기면 그때 알린다.
  while(a.length){
    try{ localStorage.setItem(RES_KEY, JSON.stringify(a.slice(0,RES_MAX))); return; }
    catch(e){ if(a.length<=1){ lsFail(e,'분석 결과'); return; } a.pop(); }
  }
}
let __persistT=null;
function persistSoon(){ if(!S._resultId) return; clearTimeout(__persistT); __persistT=setTimeout(persistResult,400); }
function deleteResult(id){ resWrite(resList().filter(x=>x.id!==id)); if(S._resultId===id) S._resultId=null; renderSavedResults(); }

/* ---------- 토큰 압축(핵심: 토큰 최소화) ---------- */
function condense(text, budget){
  if(!text) return {text:'',chars:0,orig:0};
  const orig=text.length;
  let lines=text.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const seen=new Set(); lines=lines.filter(l=>{const k=l.slice(0,70); if(seen.has(k))return false; seen.add(k);return true;});
  const kw=/(필수|요건|요구|준수|규정|평가|배점|제출|기준|해야|하여야|이상|이하|충족|항목|범위|일정|예산|보안|성능|SLA|책임|벌칙|감점|가점|목표|KPI|ROI|차별|경쟁|일정|납기|품질|검증|운영|유지보수|계약)/;
  const head=/^(\d+[\.\)]|[가-힣]\.|[IVXLC]+\.|[■▶◆◇○●·▪]|[-*#]\s|제\s?\d+\s?[조항장])/;
  const scored=lines.map((l,i)=>{ let s=0; if(kw.test(l))s+=3; if(head.test(l))s+=2; if(/\d/.test(l))s+=1; if(l.length>=12&&l.length<=160)s+=1; if(l.length<6)s-=2; return {l,i,s}; });
  const sorted=[...scored].sort((a,b)=>b.s-a.s);
  const keep=new Set(); let acc=0;
  for(const o of sorted){ if(acc+o.l.length+1>budget)continue; keep.add(o.i); acc+=o.l.length+1; if(acc>=budget)break; }
  let out=scored.filter(o=>keep.has(o.i)).sort((a,b)=>a.i-b.i).map(o=>o.l).join('\n');
  if(out.length<240) out=text.slice(0,budget);
  return {text:out, chars:out.length, orig};
}
function condensedAll(){
  const b=S.budget;
  return {
    rfp: S.docs.rfp? condense(S.docs.rfp.text, Math.round(b*1.1)) : {text:'',chars:0,orig:0},
    proposal: S.docs.proposal? condense(S.docs.proposal.text, b) : {text:'',chars:0,orig:0},
    summary: S.docs.summary? condense(S.docs.summary.text, Math.round(b*0.5)) : {text:'',chars:0,orig:0},
  };
}
function estPipeline(){
  const c=condensedAll();
  const inChars=c.rfp.chars+c.proposal.chars+c.summary.chars+1400; // +prompt scaffolding
  const origChars=(S.docs.rfp?.chars||0)+(S.docs.proposal?.chars||0)+(S.docs.summary?.chars||0);
  const calls={economy:1,standard:2,precision:3}[S.mode];
  const inTok=estTokens(' '.repeat(0))+Math.round(estTokens('가'.repeat(0)))+Math.round(inChars*0.55*calls);
  const inTokReal=Math.round((estTokens(c.rfp.text)+estTokens(c.proposal.text)+estTokens(c.summary.text)+500)*calls);
  const outTok=Math.round(900*calls);
  const origTok=estTokens((S.docs.rfp?.text||'')+(S.docs.proposal?.text||'')+(S.docs.summary?.text||''));
  const savedTok=Math.max(0, origTok - estTokens(c.rfp.text+c.proposal.text+c.summary.text));
  return {inTok:inTokReal, outTok, total:inTokReal+outTok, calls, savedTok, origTok, origChars};
}
function costOf(inTok,outTok,prov){ const r=RATES[prov||S.provider]; return (inTok/1e6*r.in)+(outTok/1e6*r.out); }

/* ---------- 파일 인입 ---------- */
async function extractFile(file){
  const name=file.name.toLowerCase();
  // 1) 텍스트 계열 — 가장 토큰 효율적·정확
  if(/\.(txt|md|markdown|csv|tsv|json|log|xml|html?)$/.test(name)){
    let t=await file.text();
    if(/\.html?$/.test(name)){ /* inert 파싱: 스크립트 미실행·리소스 미로딩 (구: div.innerHTML) */ const doc=new DOMParser().parseFromString(t,'text/html'); t=((doc&&doc.body&&doc.body.textContent)||t); }
    return t;
  }
  // 2) PDF (텍스트형) — pdf.js
  if(name.endsWith('.pdf')){
    if(!window.pdfjsLib) throw new Error('PDF 라이브러리 미로딩(오프라인). TXT/DOCX로 변환하거나 텍스트를 붙여넣어 주세요.');
    const buf=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise; let t='';
    for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const c=await pg.getTextContent(); t+=c.items.map(x=>x.str).join(' ')+'\n'; }
    if(t.replace(/\s/g,'').length<40) throw new Error('PDF에서 텍스트를 찾지 못했습니다(스캔/이미지 PDF로 보임). OCR 후 TXT 또는 텍스트형 PDF로 올려주세요.');
    return t;
  }
  // 3) DOCX — mammoth
  if(name.endsWith('.docx')){
    if(!window.mammoth) throw new Error('DOCX 라이브러리 미로딩(오프라인). TXT로 변환하거나 텍스트를 붙여넣어 주세요.');
    const buf=await file.arrayBuffer(); const r=await mammoth.extractRawText({arrayBuffer:buf}); return r.value;
  }
  // 4) HWPX (한글 신형, ZIP+XML) — JSZip로 본문 XML 추출
  if(name.endsWith('.hwpx')){
    if(!window.JSZip) throw new Error('압축 라이브러리 미로딩(오프라인). TXT/PDF로 변환해 올려주세요.');
    const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const paths=Object.keys(zip.files).filter(p=>/Contents\/(section\d+|content)\.xml$/i.test(p)||/\.(section|text)\.xml$/i.test(p));
    const targets=paths.length?paths:Object.keys(zip.files).filter(p=>/\.xml$/i.test(p)&&/content/i.test(p));
    let out='';
    for(const p of targets.sort()){ const xml=await zip.files[p].async('string');
      out+=xml.replace(/<[^>]+>/g,m=>/<\/?(hp:p|hp:linesegarray|w:p|p)\b/i.test(m)?'\n':' ').replace(/&[a-z]+;/g,' ')+'\n'; }
    out=out.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
    if(out.replace(/\s/g,'').length<20) throw new Error('HWPX 본문을 추출하지 못했습니다. 한글에서 "다른 이름으로 저장 → PDF" 또는 TXT로 올려주세요.');
    return out;
  }
  // 5) HWP (구형 바이너리) — 브라우저 파싱 한계 → 변환 안내(가능한 문자열만 best-effort)
  if(name.endsWith('.hwp')){
    throw new Error('구형 HWP(.hwp)는 브라우저에서 정확히 파싱되지 않습니다. 한글에서 "PDF로 저장" 또는 "HWPX/TXT로 저장" 후 올려주세요. (토큰 절약·정확도 모두 향상)');
  }
  // 6) RTF — 제어어 제거 best-effort
  if(name.endsWith('.rtf')){
    const raw=await file.text();
    const t=raw.replace(/\\par[d]?/g,'\n').replace(/\\'[0-9a-f]{2}/gi,' ').replace(/\\[a-z]+-?\d* ?/gi,'').replace(/[{}]/g,'').replace(/[ \t]+/g,' ').trim();
    if(t.length<20) throw new Error('RTF 추출 실패. TXT/DOCX로 변환해 올려주세요.'); return t;
  }
  // 7) DOC / PPTX 등 기타 → 텍스트 시도 후 안내
  try{
    const t=await file.text();
    if(/[\x00-\x08\x0e-\x1f]/.test(t.slice(0,400))) throw 0;   // 바이너리로 판단
    if(t.trim().length<20) throw 0;
    return t;
  }catch(e){
    throw new Error('이 형식('+(name.split('.').pop()||'?')+')은 직접 파싱이 어렵습니다. 권장 형식(TXT·DOCX·HWPX·텍스트형 PDF)으로 변환하거나, 본문을 복사해 붙여넣어 주세요.');
  }
}

/* ---------- LLM 어댑터 ---------- */
async function fetchT(url, opts={}, ms=120000){
  const ctl=new AbortController(); let timedOut=false;
  const t=setTimeout(()=>{ timedOut=true; ctl.abort(); }, ms);
  const ext=opts.signal;
  if(ext){ if(ext.aborted) ctl.abort(); else ext.addEventListener('abort',()=>ctl.abort()); }
  try{ return await fetch(url,{...opts,signal:ctl.signal}); }
  catch(e){
    if(e.name==='AbortError'){
      if(timedOut) throw new Error('응답 시간 초과('+Math.round(ms/1000)+'초). 네트워크/프록시(CORS) 또는 모델명을 확인하세요.');
      throw new Error('__CANCELLED__');
    }
    throw new Error('네트워크 오류: 호출에 실패했습니다(CORS/방화벽/키 확인). '+(e.message||''));
  }
  finally{ clearTimeout(t); }
}
/**
 * LLM 응답이 **출력 토큰 상한에서 잘렸는지** 판정한다 (2026-09-28).
 *
 * 세 공급자 모두 잘렸다는 사실을 알려 주는데 지금까지 그 값을 버리고 있었다.
 *   Claude  stop_reason  === 'max_tokens'
 *   GPT     finish_reason=== 'length'
 *   Gemini  finishReason === 'MAX_TOKENS'
 * 잘린 응답은 JSON 이 미완성이라 파싱이 깨지거나, 파싱돼도 **내용이 빠진 채**
 * 정상처럼 보인다. 사용자는 그 사실을 알 길이 없다.
 * 3002 에서 같은 원인으로 배점 분석이 통째로 비었다(09-28 실측).
 * maxTok 기본값이 1100 이라 이 앱은 특히 자주 걸린다.
 */
function llmStopReason(p, d){
  if(!d) return '';          // 응답이 없거나 모양이 다를 때 터지지 않는다
  if(p==='claude') return d.stop_reason||'';
  if(p==='gpt')    return d.choices?.[0]?.finish_reason||'';
  if(p==='gemini') return d.candidates?.[0]?.finishReason||'';
  return '';
}
function llmTruncated(p, d){
  const r=llmStopReason(p,d);
  return r==='max_tokens' || r==='length' || r==='MAX_TOKENS';
}
function warnIfTruncated(p, d, maxTok){
  if(!llmTruncated(p,d)) return false;
  toast('⚠ 응답이 출력 상한('+maxTok+' 토큰)에서 잘렸습니다. 결과 일부가 빠졌을 수 있습니다.');
  try{ console.warn('[LLM 출력 절단] provider='+p+' stop='+llmStopReason(p,d)+' maxTok='+maxTok); }catch(e){}
  return true;
}

async function callLLM(system, user, maxTok=1100){
  const p=S.provider, cfg=S.api[p];
  if(!(await confirmExternalSend({provider:p,endpointHost:hostOf(p),dataKinds:['제안서 품질분석 자료'],fieldCount:1,maskApplied:true,fileBase64Included:false}))) throw new Error('사용자가 외부 LLM 전송을 취소했습니다');
  try{ logExternalSend({app:'EQM',provider:p,endpointHost:hostOf(p),dataKinds:['품질분석'],charCount:(user||'').length,fieldCount:1,maskApplied:true,fileBase64Included:false}); }catch(e){}
  if(!cfg.key) throw new Error(PROVIDER_META[p].name+' API 키가 설정되지 않았습니다. (API 연동 메뉴)');
  const base=(cfg.base||'').trim().replace(/\/+$/,'');
  if(p==='claude'){
    const res=await fetchT((base||'https://api.anthropic.com')+'/v1/messages',{method:'POST',signal:S.abortCtl?.signal,
      headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:cfg.model,max_tokens:maxTok,system,messages:[{role:'user',content:user}]})});
    if(!res.ok) throw new Error('Claude 오류 '+res.status+': '+(await res.text()).slice(0,180));
    const d=await res.json();
    const text=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    if(!text) throw new Error('Claude 빈 응답입니다. 모델명(예: claude-sonnet-4-5) 또는 키를 확인하세요.');
    const cut=warnIfTruncated('claude', d, maxTok);
    return {text, truncated:cut, stopReason:llmStopReason('claude',d), usage:{in:d.usage?.input_tokens||0, out:d.usage?.output_tokens||0}};
  }
  if(p==='gpt'){
    const isNew=/^(o\d|gpt-5|gpt-4\.1|chatgpt)/i.test(cfg.model);
    const body={model:cfg.model, messages:[{role:'system',content:system},{role:'user',content:user}], response_format:{type:'json_object'}};
    body[isNew?'max_completion_tokens':'max_tokens']=maxTok;
    let res, txt='';
    for(let attempt=0; attempt<4; attempt++){
      res=await fetchT((base||'https://api.openai.com/v1')+'/chat/completions',{method:'POST',signal:S.abortCtl?.signal,
        headers:{'content-type':'application/json','authorization':'Bearer '+cfg.key}, body:JSON.stringify(body)});
      if(res.ok) break;
      txt=await res.text(); let changed=false;
      // max_tokens ↔ max_completion_tokens 호환
      if(/max_completion_tokens|max_tokens.*(unsupported|not supported)/i.test(txt) && ('max_tokens' in body)){ body.max_completion_tokens=body.max_tokens; delete body.max_tokens; changed=true; }
      else if(/max_completion_tokens/i.test(txt) && ('max_completion_tokens' in body) && !('max_tokens' in body)){ /* already set */ }
      // response_format 미지원 모델
      if(/response_format|json_object|'response_format'/i.test(txt) && body.response_format){ delete body.response_format; changed=true; }
      // temperature 미지원 (reasoning 계열)
      if(/temperature/i.test(txt) && ('temperature' in body)){ delete body.temperature; changed=true; }
      if(!changed) break;
    }
    if(!res.ok) throw new Error('GPT 오류 '+res.status+': '+(txt||'').slice(0,220));
    const d=await res.json();
    const text=d.choices?.[0]?.message?.content||'';
    if(!text) throw new Error('GPT 빈 응답입니다. 모델명(예: gpt-4o-mini) 또는 출력 토큰을 확인하세요.');
    const cut=warnIfTruncated('gpt', d, maxTok);
    return {text, truncated:cut, stopReason:llmStopReason('gpt',d), usage:{in:d.usage?.prompt_tokens||0,out:d.usage?.completion_tokens||0}};
  }
  if(p==='gemini'){
    const url=(base||'https://generativelanguage.googleapis.com/v1beta')+'/models/'+cfg.model+':generateContent?key='+encodeURIComponent(cfg.key);
    const res=await fetchT(url,{method:'POST',signal:S.abortCtl?.signal,headers:{'content-type':'application/json'},
      body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:maxTok,responseMimeType:'application/json',temperature:0.2}})});
    if(!res.ok) throw new Error('Gemini 오류 '+res.status+': '+(await res.text()).slice(0,220));
    const d=await res.json();
    const text=(d.candidates?.[0]?.content?.parts||[]).map(x=>x.text).join('');
    if(!text) throw new Error('Gemini 빈 응답입니다. 모델명(예: gemini-2.0-flash) 또는 키를 확인하세요.');
    const u=d.usageMetadata||{};
    const cut=warnIfTruncated('gemini', d, maxTok);
    return {text, truncated:cut, stopReason:llmStopReason('gemini',d), usage:{in:u.promptTokenCount||0,out:u.candidatesTokenCount||0}};
  }
  throw new Error('알 수 없는 provider');
}
function parseJSON(t){
  if(!t) return null;
  let s=t.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();
  const tryParse=x=>{ try{ return JSON.parse(x); }catch(e){ return undefined; } };
  let r=tryParse(s); if(r!==undefined) return r;
  const a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a>=0&&b>a) s=s.slice(a,b+1);
  r=tryParse(s); if(r!==undefined) return r;
  // 흔한 결함 보정: 트레일링 콤마 제거
  const cleaned=s.replace(/,\s*([}\]])/g,'$1');
  r=tryParse(cleaned); if(r!==undefined) return r;
  return null;
}

  return {hasR,hasP,hasS,target,
    subj: target==='summary'?'제안 발표본(요약본)':'제안서 본문',
    label: target==='summary'?'발표본 단독 검사':(hasR?'RFP 대조 검사':'제안서 단독 검사')};

/* ---------- 파이프라인 ---------- */
function logCall(label,u){ S.tokens.input+=u.in; S.tokens.output+=u.out; S.tokens.total=S.tokens.input+S.tokens.output; S.tokens.calls.push({label,in:u.in,out:u.out}); updateSideTokens(); }
function updateSideTokens(){
  $('#sideTok').textContent=fmt(S.tokens.total);
  const cost=S.tokens.calls.reduce((a,c)=>a+costOf(c.in,c.out),0);
  $('#sideTokSub').textContent = S.tokens.calls.length? (S.tokens.calls.length+'회 호출 · 추정 $'+cost.toFixed(4)) : '아직 호출 없음 · 예상 비용 $0.0000';
}
function normalizeResult(base, reval){
  const sec=SECTORS[S.sector];
  // category scores
  const cmap={}; (base.categories||[]).forEach(c=>cmap[c.key]=clamp(c.score));
  if(reval&&reval.categories) reval.categories.forEach(c=>{ if(c.key in cmap) cmap[c.key]=clamp(c.score); });
  const CRIT={req:'RFP 요구사항 충족 비율과 근거 구체성',compliance:'서식·목차·규정 준수',logic:'논리 연결·목차 구조',evidence:'정량 근거 제시 정도',risk:'리스크 식별·대응 구체성',diff:'차별 요소와 입증',readability:'문장 명료성·표현 완성도·오탈자',align:'제안서–발표본 정합성'};
  const categories=CATS.map(c=>({key:c.key,label:c.label,score:cmap[c.key]!=null?cmap[c.key]:70,weight:sec.weights[c.key]||10,criteria:CRIT[c.key]}));
  // requirements (merge reval status)
  const rmap={}; (reval&&reval.requirements||[]).forEach(r=>rmap[r.id]=r.status);
  const requirements=(base.requirements||[]).map(r=>({ id:r.id||('R'), text:r.text||'', mandatory:!!r.mandatory, status:rmap[r.id]||r.status||'partial', evidence:r.evidence||'', fix:r.fix||'', page:r.page||'', criterion:r.criterion||'' }));
  const cov={met:0,partial:0,missing:0,total:requirements.length};
  requirements.forEach(r=>cov[r.status]=(cov[r.status]||0)+1);
  // overall weighted
  const tw=categories.reduce((a,c)=>a+c.weight,0);
  let overall=Math.round(categories.reduce((a,c)=>a+c.score*c.weight,0)/(tw||1));
  const confidence=reval&&reval.confidence!=null?clamp(reval.confidence):Math.max(60,Math.min(88,overall-6));
  const flags=(reval&&reval.flags||[]).map(f=>({target:f.target,issue:f.issue,delta:f.delta||''}));
  return {
    sector:S.sector, provider:S.provider, model:S.api[S.provider].model, mode:S.mode, ts:Date.now(),
    scope:inspectScope().label,

    categories, requirements, coverage:cov,
    strengths:(base.strengths||[]).slice(0,8),
    risks:(base.risks||[]).map(r=>({level:r.level||'mid',title:r.title||'',detail:r.detail||'',action:r.action||'',page:r.page||''})),
    typos:(base.typos||[]).map(t=>({page:t.page||'',kind:t.kind||'오타',wrong:t.wrong||'',fix:t.fix||''})),

    alignment:{rfp: inspectScope().hasR?clamp(base.alignment?.rfp??overall):null,
               summary: (S.docs.proposal&&S.docs.summary)?clamp(base.alignment?.summary??(overall-4)):null},
    reval:{ adjusted:flags.length, flags, note:(reval&&reval.note)||'재검증 미실행(절약 모드)', applied:!!reval },

  };
}
function clamp(v){ if(typeof v!=='number'&&typeof v!=='string')return 70; if(v==='')return 70; v=Number(v); if(!Number.isFinite(v))return 70; return Math.max(0,Math.min(100,Math.round(v))); }

async function runPipeline(){
  if(S.running) return;
  const sc=inspectScope();
  if(!sc.target){ go('upload'); toast('제안서 본문 또는 발표본(요약본) 중 1개 이상을 업로드하세요.'); return; }
  // 활성 제공자에 키가 없으면 키가 입력된 다른 제공자로 자동 전환 (어떤 키든 사용)
  if(!S.api[S.provider].key){
    const alt=['claude','gemini','gpt'].find(p=>S.api[p].key);
    if(alt){ S.provider=alt; save(); syncProviderSeg(); toast(PROVIDER_META[alt].name+' 키로 검사를 진행합니다.'); }
  }
  if(!S.api[S.provider].key){ go('api'); toast('Claude·Gemini·GPT 중 아무 API 키나 1개 이상 입력하세요.'); return; }
  S.running=true; S.cancelled=false; S.lastError=null; S.abortCtl=new AbortController(); S.tokens={input:0,output:0,total:0,calls:[]}; updateSideTokens();
  go('inspect'); renderInspect(true);
  const t0=Date.now(); clearInterval(S._timer);
  S._timer=setInterval(()=>{ const e=$('#elapsed'); if(e) e.textContent=Math.round((Date.now()-t0)/1000)+'s'; },250);
  const c=condensedAll();
  const steps=$$('#pipe .pstep');
  const setStep=(i,st)=>{ steps[i].classList.remove('pending','active','done'); steps[i].classList.add(st); };
  const stepTok=(i,t)=>{ const e=steps[i].querySelector('.ptok'); if(e)e.textContent=t; };
  try{
    let base=null, reval=null, extracted=null;
    // step 0: preprocess (local)
    setStep(0,'active'); await delay(550);
    stepTok(0, '−'+fmt(estPipeline().savedTok)+' tok 절감');
    setStep(0,'done');
    // precision: extract requirements first
    if(S.mode==='precision'){
      setStep(1,'active');
      const p=pExtract(c); const r=await callLLM(p.sys,p.usr,900); logCall('요구사항 추출',r.usage); stepTok(1,fmt(r.usage.in+r.usage.out)+' tok');
      extracted=parseJSON(r.text); setStep(1,'done');
    } else { setStep(1,'done'); stepTok(1,'스킵(통합)'); }
    // step 2: analysis (+1회 재시도: 파싱 실패 시 JSON 강제)
    setStep(2,'active');
    const pa=pAnalysis(c);
    if(extracted&&extracted.requirements) pa.usr+='\n[추출된 요구사항 참고]\n'+JSON.stringify(extracted.requirements);
    let ra=await callLLM(pa.sys,pa.usr,3200); logCall('통합 품질분석',ra.usage); stepTok(2,fmt(ra.usage.in+ra.usage.out)+' tok');
    base=parseJSON(ra.text);
    if(!base && !S.cancelled){
      const ra2=await callLLM(pa.sys+' 반드시 유효한 JSON 객체 하나만, 코드블록·설명 없이 출력.', pa.usr, 3400);
      logCall('통합 품질분석(재시도)',ra2.usage); stepTok(2,fmt((ra.usage.in+ra.usage.out)+(ra2.usage.in+ra2.usage.out))+' tok');
      base=parseJSON(ra2.text);
    }
    if(!base) throw new Error('분석 응답을 JSON으로 해석하지 못했습니다 — 모델/출력형식을 확인하거나 절약 모드로 다시 시도하세요.');
    setStep(2,'done');
    // step 3: revalidation
    if(S.mode!=='economy'){
      setStep(3,'active');
      const pr=pReval(c,base); const rr=await callLLM(pr.sys,pr.usr,1400); logCall('교차 재검증',rr.usage); stepTok(3,fmt(rr.usage.in+rr.usage.out)+' tok');
      reval=parseJSON(rr.text); setStep(3,'done');
    } else { setStep(3,'done'); stepTok(3,'스킵(절약)'); }
    // step 4: compile
    setStep(4,'active'); await delay(500);
    S.result=normalizeResult(base,reval); S._resultId='r'+Date.now(); persistResult(); setStep(4,'done');
    await delay(350);
    toast('품질검사 완료 · 신뢰도 '+S.result.confidence+'%');
    go('dash');
  }catch(e){
    const ai=[...steps].findIndex(s=>s.classList.contains('active')); if(ai>=0) setStep(ai,'pending');
    if(S.cancelled || e.message==='__CANCELLED__') toast('검사를 중단했습니다.');
    else { S.lastError={msg:e.message, provider:S.provider, model:S.api[S.provider].model, ts:Date.now()}; toast(e.message); console.error(e); }
  }
  clearInterval(S._timer);
  S.running=false; S.abortCtl=null;
  if(S.cancelled || S.lastError) renderInspect(false);
}
window.cancelPipeline=()=>{
  if(!S.running) return;
  S.cancelled=true;
  if(S.abortCtl) S.abortCtl.abort();
  const b=$('#cancelBtn'); if(b){ b.disabled=true; b.textContent='중단 중…'; }
};
const delay=ms=>new Promise(r=>setTimeout(r,ms));

function dd(name,text){ return {name, size:text.length*2, text, chars:text.length}; }

function buildDemoResult(spec){
  const sec=SECTORS[spec.sector];
  const categories=CATS.map(c=>({key:c.key,label:c.label,score:spec.scores[c.key],weight:sec.weights[c.key],criteria:DEMO_CRIT[c.key]}));
  const requirements=spec.reqs.map(a=>({id:a[0],text:a[1],mandatory:a[2],status:a[3],evidence:a[4],fix:a[5],page:a[6],criterion:a[7]}));
  const cov={met:0,partial:0,missing:0,total:requirements.length}; requirements.forEach(r=>cov[r.status]++);
  const tw=categories.reduce((a,c)=>a+c.weight,0);
  const overall=Math.round(categories.reduce((a,c)=>a+c.score*c.weight,0)/tw);
  const calls=spec.calls||[{label:'통합 품질분석',in:4200,out:1180},{label:'교차 재검증',in:2600,out:560}];
  const tin=calls.reduce((a,c)=>a+c.in,0), tout=calls.reduce((a,c)=>a+c.out,0);
  const prov=spec.provider||S.provider;
  return {
    sector:spec.sector, provider:prov, model:spec.model||PROVIDER_META[prov].models[0], mode:spec.mode||'standard', ts:Date.now(),
    scope:spec.scope||'RFP 대조 검사',
    overall, grade:gradeOf(overall), confidence:spec.confidence,
    categories, requirements, coverage:cov,
    strengths:spec.strengths||[], risks:spec.risks||[], typos:spec.typos||[], evaluatorView:spec.evaluatorView||[],
    highlights:spec.highlights||null, subtitle:spec.subtitle||'',
    alignment:spec.alignment||{rfp:overall-2,summary:null},
    reval:{adjusted:(spec.flags||[]).length, flags:spec.flags||[], note:spec.revalNote||'재검증 완료.', applied:true},
    tokens:{input:tin,output:tout,total:tin+tout,calls}, calls,
  };
}

function caseById(id){ return DEMO_CASES.find(c=>c.id===id)||DEMO_CASES[0]; }

function loadDemoCase(id){
  const c=caseById(id);
  S.sector=c.spec.sector;
  S.mode='standard';
  S.docs={rfp:c.docs.rfp||null, proposal:c.docs.proposal||null, summary:c.docs.summary||null};
  const r=buildDemoResult(c.spec);
  S.result=r; S._resultId=null;
  S.tokens={input:r.tokens.input, output:r.tokens.output, total:r.tokens.total, calls:[...r.calls]};
  updateSideTokens(); save();
  toast('데모 케이스 · '+c.title+' 불러옴');
  go('dash');
}

function miniRingSVG(score,color){
  const R=30,C=2*Math.PI*R, off=C*(1-score/100);
  return '<svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="'+R+'" fill="none" stroke="var(--surface-2)" stroke-width="8"/>'
    +'<circle class="gauge-arc" cx="37" cy="37" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" '
    +'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" data-off="'+off.toFixed(1)+'" '
    +'transform="rotate(-90 37 37)" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1) .15s"/></svg>';
}

/* ============================ 차트 (SVG, 애니메이션) ============================ */
function gaugeSVG(score,color){
  const R=70,C=2*Math.PI*R, off=C*(1-score/100);
  return '<div class="gauge"><svg viewBox="0 0 168 168">'
    +'<circle cx="84" cy="84" r="70" fill="none" stroke="var(--surface-2)" stroke-width="14"/>'
    +'<circle class="gauge-arc" cx="84" cy="84" r="70" fill="none" stroke="'+color+'" stroke-width="14" stroke-linecap="round" '
    +'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" data-off="'+off.toFixed(1)+'" '
    +'transform="rotate(-90 84 84)" style="transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)"/></svg>'
    +'<div class="lbl"><div class="num mono" data-count="'+score+'" style="color:'+color+'">0</div><div class="cap">／ 100점</div></div></div>';
}
function radarSVG(cats){
  const cx=130,cy=126,R=94,N=cats.length;
  const pt=(v,i)=>{ const a=(-90+i*(360/N))*Math.PI/180, r=R*v/100; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  let grid=''; [25,50,75,100].forEach(lv=>{ let p=''; for(let i=0;i<N;i++){const[x,y]=pt(lv,i);p+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);} grid+='<path d="'+p+'Z" fill="none" stroke="var(--line)" stroke-width="1"/>'; });
  let axes='',labels='';
  for(let i=0;i<N;i++){ const[x,y]=pt(100,i); axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    const[lx,ly]=pt(122,i); const anchor=lx<cx-6?'end':lx>cx+6?'start':'middle';
    labels+='<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" font-size="9.4" font-weight="700" fill="var(--ink-soft)" text-anchor="'+anchor+'">'+esc(cats[i].label.replace('·','·'))+'</text>'; }
  let dp=''; for(let i=0;i<N;i++){const[x,y]=pt(cats[i].score,i);dp+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}
  let dots=''; for(let i=0;i<N;i++){const[x,y]=pt(cats[i].score,i);dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="var(--primary)"/>';}
  return '<svg viewBox="0 0 260 252" width="100%" style="max-width:380px">'+grid+axes+labels
    +'<g class="radar-poly" style="transform:scale(0);transform-origin:'+cx+'px '+cy+'px;transition:transform 1s cubic-bezier(.2,.8,.2,1)">'
    +'<path d="'+dp+'Z" fill="rgba(27,69,214,.16)" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>'+dots+'</g></svg>';
}
function donutSVG(cov){
  const R=58,C=2*Math.PI*R, total=cov.total||1;
  const segs=[['met','var(--green)',cov.met],['partial','var(--amber)',cov.partial],['missing','var(--rose)',cov.missing]];
  let acc=0, out='';
  segs.forEach(([k,col,n])=>{ const frac=n/total, len=C*frac, gap=C-len, offStart=-C*acc;
    out+='<circle class="donut-seg" cx="84" cy="84" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="20" '
      +'stroke-dasharray="0 '+C.toFixed(1)+'" data-da="'+len.toFixed(1)+' '+gap.toFixed(1)+'" stroke-dashoffset="'+offStart.toFixed(1)+'" '
      +'transform="rotate(-90 84 84)" style="transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)"/>'; acc+=frac; });
  const rate=Math.round(((cov.met+cov.partial*0.5)/total)*100);
  return '<div class="gauge" style="width:168px;height:168px"><svg viewBox="0 0 168 168">'
    +'<circle cx="84" cy="84" r="'+R+'" fill="none" stroke="var(--surface-2)" stroke-width="20"/>'+out+'</svg>'
    +'<div class="lbl"><div class="num mono" data-count="'+rate+'" data-suffix="%" style="font-size:32px">0</div><div class="cap">충족률(가중)</div></div></div>';
}
function sparkSVG(color){ return '<svg class="spark" viewBox="0 0 96 50" preserveAspectRatio="none"><path d="M0 40 L16 32 L32 36 L48 20 L64 26 L80 10 L96 16" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }

function animateCharts(scope){
  const root=scope||document;
  setTimeout(()=>{
    root.querySelectorAll('.gauge-arc').forEach(e=>e.style.strokeDashoffset=e.dataset.off);
    root.querySelectorAll('.radar-poly').forEach(e=>e.style.transform='scale(1)');
    root.querySelectorAll('.donut-seg').forEach(e=>e.style.strokeDasharray=e.dataset.da);
    root.querySelectorAll('.gbar i').forEach(e=>e.style.width=e.dataset.w);
    root.querySelectorAll('.it-bar i,.dc-cov .bar i').forEach(e=>e.style.width=e.dataset.w);
  },60);
  root.querySelectorAll('[data-count]').forEach(el=>animateCount(el));
}
function animateCount(el){
  const target=+el.dataset.count||0, suf=el.dataset.suffix||'', dur=1100, t0=performance.now();
  function step(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=Math.round(target*e)+suf; if(p<1)requestAnimationFrame(step); }
  requestAnimationFrame(step);
}

function kpi(label,val,sub,color,count,numColor,suffix,extra){
  return '<div class="kpi rv"><div class="kl"><span class="di" style="background:'+color+'"></span>'+label+'</div>'
    +'<div class="kv mono" style="color:'+(numColor||'var(--ink)')+'" '+(count?'data-count="'+val+'" data-suffix="'+(suffix||'')+'"':'')+'>'+(count?'0':val)+'</div>'
    +'<div class="ks">'+(extra?'<span class="delta up">'+extra+'</span>':'')+(sub||'')+'</div>'+sparkSVG(color)+'</div>';
}
function kpiTok(r){
  const cost=r.calls.reduce((a,c)=>a+costOf(c.in,c.out),0);
  return '<div class="kpi rv"><div class="kl"><span class="di" style="background:var(--ink)"></span>토큰 사용량</div>'
    +'<div class="kv mono" data-count="'+r.tokens.total+'">0</div>'
    +'<div class="ks"><span class="delta '+(r.tokens.total?'up':'down')+'">$'+cost.toFixed(4)+'</span>입력 '+fmt(r.tokens.input)+' · 출력 '+fmt(r.tokens.output)+'</div>'+sparkSVG('#71717a')+'</div>';
}
function gradeRow(c){ const col=catColor(c.key);
  return '<div class="grade-row"><span class="gn">'+esc(c.label)+'</span><div class="gbar"><i data-w="'+c.score+'%" style="background:'+col+'"></i></div><span class="gp mono" style="color:'+col+'">'+c.score+'</span></div>'; }
function covLeg(k,label,n,col){ return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px"><span style="width:10px;height:10px;border-radius:3px;background:'+col+'"></span><span style="font-size:12.5px;font-weight:700;color:var(--ink-soft)">'+label+'</span><span class="mono" style="margin-left:auto;font-weight:600;color:'+col+'">'+n+'</span></div>'; }
function alignRow(label,v,col){ if(v==null) return '<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700"><span style="color:var(--ink-mute)">'+label+'</span><span class="mono" style="color:var(--ink-mute)">해당 없음</span></div><div class="gbar" style="height:8px;margin-top:6px;opacity:.4"><i style="width:0;background:'+col+'"></i></div></div>';
  return '<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700"><span>'+label+'</span><span class="mono" style="color:'+col+'">'+v+'%</span></div><div class="gbar" style="height:8px;margin-top:6px"><i data-w="'+v+'%" style="background:'+col+'"></i></div></div>'; }
function riskRow(r){ return '<div class="risk '+r.level+'"><div class="rl"></div><div style="flex:1"><div class="rt">'+esc(r.title)+'<span class="lv">'+({high:'高',mid:'中',low:'低'}[r.level])+'</span>'+(r.page?'<span class="pg">'+esc(r.page)+'</span>':'')+'</div><div class="rd">'+esc(r.detail)+'</div><div class="ra">↳ '+esc(r.action)+'</div></div></div>'; }
function reqRow(r){ const st={met:['met','충족'],partial:['partial','부분'],missing:['missing','누락']}[r.status]||['partial','부분'];
  return '<tr><td class="mono" style="font-weight:600;color:var(--primary)">'+esc(r.id)+'</td>'
    +'<td><b style="font-weight:700">'+esc(r.text)+'</b>'+(r.mandatory?'<span class="must">필수</span>':'')+(r.page?'<span class="pg">'+esc(r.page)+'</span>':'')+(r.criterion?'<div style="font-size:10.5px;color:var(--ink-mute);font-weight:600;margin-top:3px">기준: '+esc(r.criterion)+'</div>':'')+'</td>'
    +'<td><span class="st '+st[0]+'"><span class="d"></span>'+st[1]+'</span></td>'
    +'<td style="font-size:11.5px;color:var(--ink-soft)">'+esc(r.evidence||'-')+(r.fix?'<div style="color:var(--primary);font-weight:600;margin-top:3px">보완: '+esc(r.fix)+'</div>':'')+'</td></tr>'; }
function evRow(e){ const c={high:'var(--rose)',mid:'var(--amber)',low:'var(--teal)'}[e.severity]||'var(--amber)';
  return '<div class="evrow"><span class="evdot" style="background:'+c+'"></span><div><div class="evt">'+esc(e.title)+'</div><div class="evc">'+esc(e.comment)+'</div></div></div>'; }

function wireDrops(){
  ['rfp','proposal','summary'].forEach(slot=>{
    const d=$('#drop-'+slot); if(!d||d.dataset.wired)return; d.dataset.wired='1';
    d.addEventListener('click',()=>pickFile(slot));
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});
    d.addEventListener('dragleave',()=>d.classList.remove('over'));
    d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)ingest(slot,f);});
  });
}
function pickFile(slot){
  const useText=!S.docs[slot]&&false;
  const inp=document.createElement('input'); inp.type='file';
  inp.accept='.txt,.md,.markdown,.csv,.tsv,.json,.log,.xml,.html,.htm,.pdf,.docx,.hwpx,.hwp,.rtf,.doc,.pptx';
  inp.onchange=()=>{ if(inp.files[0])ingest(slot,inp.files[0]); };
  inp.click();
}

function errorBanner(err){

  else if(/네트워크|CORS|Failed to fetch|NetworkError/i.test(m)){ cause='네트워크/CORS 차단'; tip='OpenAI(GPT)는 로컬 파일(file://)에서 브라우저 직접 호출이 막힙니다. 해결: ① 상단에서 Claude 또는 Gemini로 전환(파일에서도 동작) ② 폴더에서 로컬 서버로 열기(python -m http.server → http://localhost) ③ API 연동의 "엔드포인트"에 본인 CORS 프록시/호환 게이트웨이 URL 입력.'; }

  else if(/파싱|JSON/i.test(m)){ cause='JSON 응답 해석 실패'; tip='모델을 JSON 지원 모델로 바꾸거나 절약 모드로 재시도하세요.'; }

    +'<div class="eb-body"><div class="eb-h">검사 실패 · '+esc(cause)+' <span class="eb-meta">'+esc(pm||'')+' / '+esc(err.model||'')+'</span></div>'

function buildImprovements(r){

  arr.sort((a,b)=>ord[a.pri]-ord[b.pri]);
