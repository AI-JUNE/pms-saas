  if(top3.length) html+='<div class="top3"><div class="top3-h">지금 고쳐야 할 핵심 '+top3.length+'</div>'
    +top3.map((x,i)=>'<div class="top3-row"><span class="top3-n mono">'+(i+1)+'</span><span class="imp-pri '+PRI[x.pri][1]+'">'+PRI[x.pri][0]+'</span><span class="top3-t">'+esc(x.text||'(내용 입력)')+'</span></div>').join('')+'</div>';
  if(!items.length){ box.innerHTML='<p style="font-size:12.5px;color:var(--ink-soft);padding:6px 0">개선 과제가 없습니다. 모든 항목이 충족되었거나, 우측 버튼으로 직접 추가할 수 있습니다.</p>'; return; }
  html+='<div class="imp-list">'+items.map(x=>
    '<div class="imp-card '+PRI[x.pri][1]+(x.done?' done':'')+'" data-id="'+esc(x.id)+'">'
    +'<div class="imp-top">'
      +'<select class="imp-sel noprint" data-act="pri">'+['high','mid','low'].map(p=>'<option value="'+p+'" '+(x.pri===p?'selected':'')+'>'+PRI[p][0]+'</option>').join('')+'</select>'
      +'<span class="imp-pri imp-pri-print '+PRI[x.pri][1]+'" style="display:none">'+PRI[x.pri][0]+'</span>'
      +'<span class="imp-src">'+esc(x.src||'직접 추가')+'</span>'
      +'<label class="imp-done-l noprint"><input type="checkbox" '+(x.done?'checked':'')+' data-act="done"> 반영 완료</label>'
      +'<button class="imp-del noprint" data-act="del" title="삭제"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'
    +'</div>'
    +'<textarea class="imp-edit" rows="2" placeholder="개선·보완 내용을 입력하세요" data-act="edit">'+esc(x.text||'')+'</textarea>'
    +'</div>').join('')+'</div>';
  box.innerHTML=html;
  bindImproveEvents(box);
  // auto-size textareas
  box.querySelectorAll('.imp-edit').forEach(t=>{ t.style.height='auto'; t.style.height=t.scrollHeight+'px';
    t.addEventListener('input',()=>{ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }); });
}

/* 개선카드 이벤트 위임 (2026-08-12, 승인 묶음 #3)
   인라인 핸들러에 x.id 를 문자열로 박으면 LLM 이 만든 id 가 JS 컨텍스트로 들어간다
   (esc() 는 홑따옴표를 치환하지 않는다). data-id 는 esc() 를 거치므로
   여기서 속성값으로 읽으면 문자열 결합 없이 안전하다.
   renderImproveBoard 는 여러 번 호출되므로 리스너는 한 번만 건다. */
function bindImproveEvents(box){
  if(!box || box._impBound) return; box._impBound=true;
  const idOf=el=>{ const c=el.closest && el.closest('.imp-card'); return c?c.getAttribute('data-id'):null; };
  box.addEventListener('change',e=>{
    const t=e.target; if(!t.getAttribute) return;
    const act=t.getAttribute('data-act'); if(act!=='pri'&&act!=='done') return;
    const id=idOf(t); if(id==null) return;
    if(act==='pri') setImprovePri(id,t.value); else toggleImprove(id);
  });
  box.addEventListener('input',e=>{
    const t=e.target; if(!t.getAttribute||t.getAttribute('data-act')!=='edit') return;
    const id=idOf(t); if(id!=null) editImprove(id,t.value);
  });
  box.addEventListener('click',e=>{
    const t=e.target.closest && e.target.closest('[data-act="del"]'); if(!t) return;
    const id=idOf(t); if(id!=null) delImprove(id);
  });
}
window.editImprove=(id,v)=>{ const it=S.result.improvements.find(x=>x.id===id); if(it)it.text=v; persistSoon(); };
window.toggleImprove=id=>{ const it=S.result.improvements.find(x=>x.id===id); if(it)it.done=!it.done; renderImproveBoard(); };
window.setImprovePri=(id,v)=>{ const it=S.result.improvements.find(x=>x.id===id); if(it)it.pri=v; const ord={high:0,mid:1,low:2}; S.result.improvements.sort((a,b)=>ord[a.pri]-ord[b.pri]); renderImproveBoard(); };
window.addImprove=()=>{ buildImprovements(S.result); S.result.improvements.push({id:'u'+Date.now(),pri:'mid',src:'직접 추가',text:'',done:false}); renderImproveBoard(); toast('개선안을 추가했습니다.'); };
window.delImprove=id=>{ S.result.improvements=(S.result.improvements||[]).filter(x=>x.id!==id); renderImproveBoard(); };
function repStat(l,v){ return '<div style="background:var(--surface);border-radius:12px;padding:13px 15px"><div style="font-size:11px;color:var(--ink-soft);font-weight:700">'+l+'</div><div class="mono" style="font-size:20px;font-weight:600;margin-top:4px">'+v+'</div></div>'; }
window.exportJSON=()=>{ const blob=new Blob([JSON.stringify(S.result,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='proposal-qa-report-'+Date.now()+'.json'; a.click(); toast('JSON 리포트를 내보냈습니다.'); };

/* ----- API 연동 ----- */
function renderApi(){
  const el=$('#view-api');
  el.innerHTML=
  '<div class="section-title"><span class="stbar"></span>LLM API 연동<span class="stn">KEYS STORED LOCALLY</span></div>'
  +'<div class="api-grid">'+['claude','gemini','gpt'].map(p=>{ const m=PROVIDER_META[p], cfg=S.api[p], on=!!cfg.key;
    return '<div class="api-card '+(on?'on':'')+'" id="api-'+p+'"><div class="ach"><div class="alogo" style="background:'+m.color+'">'+p[0].toUpperCase()+'</div><h4>'+m.name+'</h4><span class="astat">'+(on?'연결됨':'미설정')+'</span></div>'
      +'<label class="fld"><span class="fl">API 키</span><input class="inp mono" type="password" value="'+esc(cfg.key)+'" placeholder="'+(p==='claude'?'sk-ant-...':p==='gpt'?'sk-...':'AIza...')+'" oninput="setKey(\''+p+'\',this.value)"></label>'
      +'<label class="fld"><span class="fl">모델 <span style="color:var(--ink-mute);font-weight:500">(수정 가능)</span></span>'
        +'<input class="inp mono" list="ml-'+p+'" value="'+esc(cfg.model)+'" oninput="setModel(\''+p+'\',this.value)">'
        +'<datalist id="ml-'+p+'">'+m.models.map(x=>'<option value="'+x+'">').join('')+'</datalist></label>'
      +'<label class="fld"><span class="fl">엔드포인트 <span style="color:var(--ink-mute);font-weight:500">(선택 · 프록시/호환 게이트웨이)</span></span>'
        +'<input class="inp mono" value="'+esc(cfg.base||'')+'" placeholder="'+(p==='claude'?'기본: https://api.anthropic.com':p==='gpt'?'기본: https://api.openai.com/v1':'기본: https://generativelanguage.googleapis.com/v1beta')+'" oninput="setBase(\''+p+'\',this.value)"></label>'
      +'<div class="use-radio"><input type="radio" name="useprov" data-p="'+p+'" id="useprov-'+p+'" '+(S.provider===p?'checked':'')+' onchange="setProvider(\''+p+'\')"> 이 모델을 검사에 사용 (추정 단가 입력 $'+RATES[p].in+'/출력 $'+RATES[p].out+' /1M)</div></div>';
  }).join('')+'</div>'
  +'<div class="notice"><svg viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>'
    +'<div><b>보안 안내</b> · API 키는 이 브라우저(localStorage)에만 저장되며 외부로 전송되지 않습니다. 요청은 각 제공사 서버로 직접 호출됩니다. 키를 입력하면 해당 제공자가 검사에 자동 선택됩니다(여러 개면 라디오로 전환). '
    +'브라우저 직접 호출 특성상 일부 환경에서 CORS 차단이 발생할 수 있습니다. 특히 <b>GPT(OpenAI)는 로컬 파일(file://)에서 직접 호출이 차단</b>됩니다 — 이 경우 <b>Claude·Gemini로 전환</b>하거나, 로컬 서버(http://localhost)로 열거나, 위 "엔드포인트"에 프록시 URL을 입력하세요. 모델명·단가는 제공사 최신 정보로 직접 갱신하세요.</div></div>'
  +'<div class="card pad" style="margin-top:18px"><div class="card-h"><h3>토큰 사용 현황</h3><span class="hint">세션 누적</span></div>'
    +(S.tokens.calls.length? '<table class="req-table" style="margin-top:6px"><thead><tr><th>단계</th><th>입력</th><th>출력</th><th>합계</th><th>추정 $</th></tr></thead><tbody>'
      +S.tokens.calls.map(c=>'<tr><td><b>'+esc(c.label)+'</b></td><td class="mono">'+fmt(c.in)+'</td><td class="mono">'+fmt(c.out)+'</td><td class="mono">'+fmt(c.in+c.out)+'</td><td class="mono">$'+costOf(c.in,c.out).toFixed(4)+'</td></tr>').join('')
      +'<tr style="border-top:2px solid var(--line)"><td><b>합계</b></td><td class="mono"><b>'+fmt(S.tokens.input)+'</b></td><td class="mono"><b>'+fmt(S.tokens.output)+'</b></td><td class="mono"><b>'+fmt(S.tokens.total)+'</b></td><td class="mono"><b>$'+S.tokens.calls.reduce((a,c)=>a+costOf(c.in,c.out),0).toFixed(4)+'</b></td></tr></tbody></table>'
      :'<p style="font-size:12.5px;color:var(--ink-soft);margin-top:8px">아직 호출 기록이 없습니다. 검사를 실행하면 단계별 토큰이 기록됩니다.</p>')+'</div>';
}
window.setKey=(p,v)=>{
  v=v.trim(); S.api[p].key=v; save();
  $('#api-'+p).classList.toggle('on',!!v);
  $('#api-'+p+' .astat').textContent=v?'연결됨':'미설정';
  // 키를 입력하면 그 제공자를 활성으로 — 현재 활성 제공자에 키가 없을 때 자동 전환
  if(v && !S.api[S.provider].key && S.provider!==p) setActiveProvider(p);
  // 활성 제공자의 키를 비우면, 키가 남아있는 다른 제공자로 자동 전환
  else if(!v && S.provider===p){ const alt=['claude','gemini','gpt'].find(x=>S.api[x].key); if(alt&&alt!==p) setActiveProvider(alt); }
  updateApiBadge();
};
function setActiveProvider(p){
  S.provider=p; save();
  const r=$('#useprov-'+p); if(r) r.checked=true;
  syncProviderSeg();
}
window.setModel=(p,v)=>{ S.api[p].model=v.trim(); save(); };
window.setBase=(p,v)=>{ S.api[p].base=v.trim(); save(); };
window.setProvider=p=>{ S.provider=p; save(); syncProviderSeg(); };

/* ============================ 네비게이션 ============================ */
const VIEWS={ dash:['대시보드','제안서 품질 대시보드',renderDash], upload:['문서 업로드','문서 업로드 & 토큰 설정',renderUpload],
  inspect:['품질검사 실행','검증 파이프라인',()=>renderInspect(false)], reval:['재검증 리포트','교차 재검증 결과',renderReval],
  report:['종합 리포트','품질검사 종합 리포트',renderReport], api:['API 연동','LLM API & 토큰',renderApi] };
function go(v){
  $$('.view').forEach(x=>x.hidden=true); $('#view-'+v).hidden=false;
  $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));
  const m=VIEWS[v]; $('#crumb').innerHTML='제안 품질관리 · <b>'+m[0]+'</b>'; $('#topTitle').textContent=m[1];
  m[2](); $('.scroll').scrollTop=0;
}
window.go=go;
function syncProviderSeg(){ $$('#providerSeg button').forEach(b=>b.classList.toggle('on',b.dataset.p===S.provider)); }
function updateApiBadge(){ const n=['claude','gemini','gpt'].filter(p=>S.api[p].key).length; const b=$('#navApiBadge'); b.hidden=n===0; b.textContent=n; }
/* loadDemo/loadDemoCase는 데모 데이터 블록에서 정의됨 */

/* ============================ 초기화 ============================ */
function init(){
  load(); syncProviderSeg(); updateApiBadge(); updateSideTokens();
  $('#nav').addEventListener('click',e=>{ const it=e.target.closest('.nav-item'); if(it)go(it.dataset.view); });
  $$('#providerSeg button').forEach(b=>b.addEventListener('click',()=>{ S.provider=b.dataset.p; save(); syncProviderSeg(); toast(PROVIDER_META[S.provider].name+' 선택됨'); }));
  $('#demoBtn').addEventListener('click',loadDemo);
  $('#runTop').addEventListener('click',runPipeline);
  go('dash');
}
document.addEventListener('DOMContentLoaded',init);

document.head.appendChild(ps);
